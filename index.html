 "Speaking about everything", "Seeking wealth aggressively", "Leaving what does not concern him/her"], "answer": 3, "explain": "The Hadith praises avoiding unnecessary interference in matters that don't concern oneself."}, {"q": "These three Hadith (10-12) mainly teach lessons about:", "options": ["Hajj rituals", "Personal conduct: lawful earning, caution in doubt, and minding one's business", "The history of the Caliphs", "Rules of Zakat calculation"], "answer": 1, "explain": "Hadith 10-12 focus on personal ethical conduct in daily life."}], "theory": [{"q": "Explain the lessons derivable from Hadith 11 of An-Nawawi's Collection on doubtful matters.", "answer": "Should explain the meaning of the Hadith and apply it to daily situations, e.g. avoiding doubtful transactions or dealings when uncertain of their lawfulness."}]}}, {"num": 5, "title": "Moral Teaching of Islam: Social Vices", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "Islam's clear stance against corruption and dishonesty that damage society.", "sections": [{"heading": "Defining the Vices", "points": ["Bribery: giving or receiving something to unfairly influence a decision or duty.", "Corruption: dishonest or unethical conduct, especially by those in positions of power, for personal gain.", "Cybercrime: using digital technology to defraud, deceive or harm others (e.g. internet fraud, hacking).", "Stealing, vandalism, embezzlement and fraud: taking or damaging what is not rightfully yours, or misappropriating entrusted resources."]}, {"heading": "Effects on Society", "points": ["These vices erode public trust, widen inequality, discourage honest effort, and weaken institutions.", "They can cause economic loss, insecurity, and social instability within a community or nation."]}, {"heading": "Islamic Teachings Against These Vices", "points": ["Q2:188 forbids consuming others' wealth unjustly or using bribery to seize others' property unlawfully.", "Q81:1-5 (and the wider Surah) warns of severe consequences for those who defraud/deal unjustly in measurements and dealings.", "Islam commands honesty, trustworthiness (Amanah), and fair dealing in every transaction."]}, {"heading": "Deeper Insight: Modern Applications", "points": ["Contemporary scholars extend the Qur'anic prohibition on unjust wealth (Q2:188) to cover modern issues like examination malpractice, certificate forgery, and online scams — all seen as forms of taking others' rights unjustly.", "The Prophet ﷺ famously said 'whoever deceives us is not one of us' — a principle widely cited in discussions of business ethics, including product mislabelling and false advertising.", "WAEC theory questions on this topic often ask candidates to suggest solutions, not just define the vices — good answers link Islamic teaching (fear of Allah/Taqwa, accountability on Judgement Day) to practical steps like transparency and honest record-keeping."]}], "terms": [{"ar": "رِشْوَة", "en": "Rishwah — bribery"}, {"ar": "أَمَانَة", "en": "Amanah — trustworthiness"}], "refs": [{"label": "Q2:188", "url": "https://quran.com/2/188", "title": null}, {"label": "Q81:1-5", "url": "https://quran.com/81/1-5", "title": null}]}, "practice": {"mcq": [{"q": "Bribery, as defined in Islamic ethics, is:", "options": ["A lawful business transaction", "A form of charity", "Giving or receiving something to unfairly influence a decision", "A type of Zakat"], "answer": 2, "explain": "Bribery involves corrupting fair decision-making through improper gifts or payments."}, {"q": "Which verse forbids consuming others' wealth unjustly, including through bribery?", "options": ["Q2:188", "Q1:1", "Q2:255", "Q112"], "answer": 0, "explain": "Q2:188 addresses unjust consumption of others' property, including via bribery."}, {"q": "A common effect of corruption on society is:", "options": ["Increased public trust", "Erosion of public trust and weakened institutions", "Improved fairness", "Faster economic growth"], "answer": 1, "explain": "Corruption damages trust in institutions and can cause economic and social harm."}, {"q": "Islam's general teaching on all these vices (bribery, stealing, fraud, etc.) emphasises:", "options": ["Avoiding all forms of trade", "Tolerance of dishonesty for personal gain", "Honesty, trustworthiness and fair dealing", "Secrecy in all transactions"], "answer": 2, "explain": "Islam consistently commands Amanah (trustworthiness) and honest dealing in all affairs."}], "theory": [{"q": "Discuss any three social vices mentioned in the syllabus and explain the Islamic teaching against them.", "answer": "Should define three vices clearly (e.g. bribery, corruption, fraud), state their effects on society, and cite Islamic teaching against unjust dealing (e.g. Q2:188)."}]}}, {"num": 6, "title": "Hajj and 'Umrah", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "The fifth pillar of Islam — the pilgrimage that unites Muslims from every nation.", "sections": [{"heading": "Definition and Pre-requisites", "points": ["Hajj is the pilgrimage to the Ka'bah in Makkah performed during specific days of Dhul-Hijjah; 'Umrah is a lesser pilgrimage that can be performed at any time.", "Pre-requisites (Istita'ah): a Muslim must be sane, adult, and physically and financially capable of the journey."]}, {"heading": "Types of Hajj", "points": ["Ifrad — intending Hajj alone.", "Tamattu' — performing 'Umrah first, then Hajj, in the same season, with a gap between them.", "Qiran — combining the intentions of Hajj and 'Umrah together."]}, {"heading": "Rites of Hajj", "points": ["Ihram — entering the sacred state at the Miqat (designated station) with specific dress and restrictions.", "Tawaf — circling the Ka'bah seven times.", "Sa'i — walking between the hills of Safa and Marwah seven times.", "Standing at 'Arafah — the central rite of Hajj, on the 9th of Dhul-Hijjah.", "Muzdalifah and stoning the Jamarat — symbolic rejection of Satan.", "Sacrifice (Hady) and Halq/Taqsir — shaving or trimming the hair to exit the state of Ihram."]}, {"heading": "Hajj vs 'Umrah and Significance", "points": ["Hajj has fixed dates and additional rites ('Arafah, Muzdalifah, Jamarat) that 'Umrah does not include.", "Significance: spiritual purification and forgiveness of sins; socio-economic unity among Muslims of different nations, races and classes; moral lessons of equality, patience and sacrifice."]}, {"heading": "Deeper Insight: The Deeper Symbolism of Hajj", "points": ["The white, seamless Ihram garment worn by male pilgrims symbolises equality — kings and labourers stand before Allah in identical dress, erasing worldly distinctions of wealth and class.", "The seven circuits of Tawaf and seven trips of Sa'i between Safa and Marwah commemorate Hajar's desperate search for water for her son Isma'il — a story of faith and Allah's mercy in providing the well of Zamzam.", "'Id al-Adha, celebrated at the close of Hajj, commemorates Ibrahim's willingness to sacrifice Isma'il on Allah's command and Allah's mercy in providing a ram instead — linking the pilgrimage to the wider Ibrahimic legacy in Islam."]}], "terms": [{"ar": "إِحْرَام", "en": "Ihram — the sacred pilgrim state"}, {"ar": "طَوَاف", "en": "Tawaf — circling the Ka'bah"}, {"ar": "سَعْي", "en": "Sa'i — walking between Safa and Marwah"}], "refs": []}, "practice": {"mcq": [{"q": "Which type of Hajj involves performing 'Umrah first, then Hajj later in the same season?", "options": ["Tamattu'", "Qiran", "Ifrad", "Nafl"], "answer": 0, "explain": "Tamattu' means performing 'Umrah, then later performing Hajj separately within the same season."}, {"q": "The central rite of Hajj, without which Hajj is invalid, is:", "options": ["Standing at 'Arafah", "Sa'i", "Tawaf", "Shaving the head"], "answer": 0, "explain": "Standing at 'Arafah (Wuquf) on the 9th of Dhul-Hijjah is the pillar without which Hajj is invalid."}, {"q": "Stoning the Jamarat symbolises:", "options": ["Entering Ihram", "Completion of Sa'i", "Greeting other pilgrims", "Rejection of Satan"], "answer": 3, "explain": "The stoning ritual symbolises the pilgrim's rejection of Satan's temptations."}, {"q": "One key difference between Hajj and 'Umrah is that:", "options": ["'Umrah can only be done in Dhul-Hijjah", "Hajj has fixed dates and extra rites like standing at 'Arafah, which 'Umrah lacks", "'Umrah is compulsory on every Muslim once in a lifetime like Hajj", "Hajj requires no Ihram"], "answer": 1, "explain": "Hajj occurs on fixed dates with additional required rites, while 'Umrah can be performed anytime with fewer rites."}], "theory": [{"q": "Describe the rites of Hajj in their order and discuss the significance of Hajj to a Muslim.", "answer": "Should list the rites in order (Ihram, Tawaf, Sa'i, 'Arafah, Muzdalifah, Jamarat, sacrifice, Halq/Taqsir) and explain spiritual, social and moral significance."}]}}, {"num": 7, "title": "Mid-Term Tests / Open Day", "category": "Break", "isBreak": true, "breakNote": "No new lesson this week — mid-term tests, open day and mid-term holiday. Use this time to revise Weeks 1–6.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 8, "title": "Features of the Islamic Economic System", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "How the Prophet ﷺ and the Khulafa shaped fair, ethical economic dealings in the Muslim community.", "sections": [{"heading": "The Practice of the Prophet ﷺ and the Khulafa", "points": ["The Prophet ﷺ himself was a trader known for honesty; he emphasised fair weighing, truthful description of goods, and prompt payment of wages.", "The Khulafa'ur-Rashidun continued this legacy — e.g. 'Umar's strict market supervision (Hisbah) to prevent cheating and hoarding."]}, {"heading": "Key Features of the Islamic Economic System", "points": ["Halal earning: wealth must be earned through lawful means; Haram (unlawful) earnings such as gambling and fraud are forbidden.", "Prohibition of Riba (usury/interest): unjust profit from lending money is strictly forbidden (Q2:273-274 area context).", "Prohibition of Tatfif (short-measuring): cheating in weights and measures is condemned.", "Zakat and Sadaqah: obligatory and voluntary charity redistribute wealth to those in need (Q9:60).", "Baytul-Mal: the public treasury used to manage state funds for the welfare of the Ummah."]}, {"heading": "Comparison with Other Economic Systems", "points": ["Unlike purely capitalist systems, Islam obligates wealth redistribution through Zakat.", "Unlike interest-based banking, Islamic finance avoids Riba, favouring profit/loss-sharing partnerships instead."]}, {"heading": "Deeper Insight: Islamic Finance Today", "points": ["Modern Islamic banking has developed alternatives to interest-based loans, such as Murabaha (cost-plus sale) and Mudarabah (profit-sharing partnership), directly applying the classical prohibition of Riba to contemporary finance.", "'Umar ibn al-Khattab's Hisbah (market inspection) system — checking weights, prices and product quality — is considered an early precursor to modern consumer protection agencies.", "Zakat is calculated at a standard rate of 2.5% on qualifying wealth held for one lunar year above the Nisab threshold — a specific figure WAEC objective questions sometimes test directly."]}], "terms": [{"ar": "رِبَا", "en": "Riba — usury/unjust interest"}, {"ar": "بَيْتُ المَال", "en": "Baytul-Mal — the public treasury"}, {"ar": "زَكَاة", "en": "Zakat — obligatory charity"}], "refs": [{"label": "Q9:60", "url": "https://quran.com/9/60", "title": null}, {"label": "Q5:4", "url": "https://quran.com/5/4", "title": null}, {"label": "Hadith 6 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:6", "title": null}]}, "practice": {"mcq": [{"q": "What does 'Riba' refer to in Islamic economics?", "options": ["Charitable giving", "Public treasury", "Trade tax", "Unjust interest/usury"], "answer": 3, "explain": "Riba refers to unjust profit from lending, strictly prohibited in Islam."}, {"q": "Tatfif refers to:", "options": ["Voluntary charity", "Government taxation", "Short-measuring/cheating in weights and measures", "Fair trading"], "answer": 2, "explain": "Tatfif is the practice of giving less than due in weight or measure, condemned in the Qur'an."}, {"q": "The Islamic public treasury used to manage state funds is called:", "options": ["Sadaqah", "Zakat", "Baytul-Mal", "Nisab"], "answer": 2, "explain": "Baytul-Mal is the historical Islamic public treasury."}, {"q": "A key difference between the Islamic economic system and interest-based banking is that Islam:", "options": ["Encourages Riba", "Forbids all trade", "Prohibits Riba and favours profit/loss-sharing", "Has no rules on money"], "answer": 2, "explain": "Islamic finance avoids interest (Riba) and instead favours risk/profit-sharing partnerships."}], "theory": [{"q": "Discuss the main features of the Islamic economic system with reference to the practice of the Prophet ﷺ and the Khulafa'ur-Rashidun.", "answer": "Should mention halal earning, prohibition of Riba and Tatfif, Zakat/Sadaqah, and Baytul-Mal, linking to examples of the Prophet's or Khulafa's practice."}]}}, {"num": 9, "title": "Suratul-'Asr & Suratul-Humazah", "category": "Qur'an", "isBreak": false, "breakNote": "", "learn": {"intro": "Two brief but profound Makkan Suwar addressing loss, success, and the danger of slander.", "sections": [{"heading": "Suratul-'Asr (Q103) — 'The Declining Day'", "points": ["Allah swears by time (Al-'Asr) that all mankind is in loss.", "Exceptions are given: those who believe, do righteous deeds, and enjoin upon each other truth and patience.", "One of the most concise yet comprehensive summaries of a successful life in the entire Qur'an."]}, {"heading": "Suratul-Humazah (Q104) — 'The Slanderer'", "points": ["Warns against the Humazah (backbiter/slanderer) and Lumazah (fault-finder) who mock and defame others.", "Condemns those who hoard wealth and count it, thinking it will make them immortal.", "Describes their punishment as being crushed/consumed in a raging Fire (Hutamah) for their arrogance and cruelty."]}, {"heading": "Deeper Insight: Short Surahs, Deep Lessons", "points": ["Suratul-'Asr is so comprehensive that Imam ash-Shafi'i reportedly said that if people reflected on this Surah alone, it would be sufficient guidance for them.", "The word 'Humazah' comes from a root meaning to press or crush with words — vividly describing the harm of backbiting as a kind of verbal violence, matching the Surah's later image of the crushing Fire.", "Both Surahs were revealed in Makkah at a time when the early Muslim community was small, poor, and often mocked by wealthier Makkans — giving these verses of comfort and warning added historical resonance."]}], "terms": [{"ar": "العَصْر", "en": "Al-'Asr — time, the declining day"}, {"ar": "هُمَزَة", "en": "Humazah — a backbiter/slanderer"}], "refs": [{"label": "Q103", "url": "https://quran.com/103", "title": null}, {"label": "Q104", "url": "https://quran.com/104", "title": null}]}, "practice": {"mcq": [{"q": "According to Suratul-'Asr, all mankind is in loss except those who:", "options": ["Are born into Muslim families", "Are wealthy", "Live long lives", "Believe, do righteous deeds, and enjoin truth and patience"], "answer": 3, "explain": "The Surah names four conditions for being saved from loss: faith, good deeds, enjoining truth, and enjoining patience."}, {"q": "Suratul-Humazah primarily warns against:", "options": ["Backbiting, slander and hoarding wealth arrogantly", "Studying the Qur'an", "Performing Hajj incorrectly", "Excessive fasting"], "answer": 0, "explain": "The Surah condemns the Humazah/Lumazah — those who slander others and arrogantly hoard wealth."}, {"q": "Suratul-'Asr is notable for being:", "options": ["A chapter about inheritance law", "The longest chapter in the Qur'an", "One of the shortest yet most comprehensive summaries of success in life", "A chapter about Hajj rites"], "answer": 2, "explain": "Despite its brevity, scholars regard it as summarising the entire path to salvation."}, {"q": "In Suratul-Humazah, the punishment described for the arrogant hoarder is:", "options": ["Being exiled from Makkah", "Losing their wealth only", "Being forgiven easily", "Being crushed/consumed in a raging Fire (Hutamah)"], "answer": 3, "explain": "The Surah describes 'Al-Hutamah', a crushing Fire, as their consequence."}], "theory": [{"q": "What are the four qualities mentioned in Suratul-'Asr that save a person from loss? Explain each briefly.", "answer": "Should list: (1) belief/faith, (2) righteous deeds, (3) enjoining truth on one another, (4) enjoining patience on one another, with brief explanation of each."}]}}, {"num": 10, "title": "Hadith 13th & 14th of An-Nawawi's Collection", "category": "Hadith", "isBreak": false, "breakNote": "", "learn": {"intro": "Two Hadith establishing brotherhood and the sanctity of human life in Islam.", "sections": [{"heading": "Hadith 13 — Loving for Others What You Love for Yourself", "points": ["'None of you truly believes until he loves for his brother what he loves for himself.'", "Lesson: genuine faith is expressed through empathy, generosity, and goodwill toward fellow Muslims/humanity."]}, {"heading": "Hadith 14 — Sanctity of Life", "points": ["The Hadith establishes that the blood (life) of a Muslim is sacred and protected, and may not be lawfully taken except in very specific, tightly defined circumstances recognised under Islamic law.", "Lesson: Islam places extremely high value on human life and forbids its unlawful taking; these narrow exceptions were matters for a legitimate Islamic authority, not private individuals."]}, {"heading": "Deeper Insight: Brotherhood and Its Limits", "points": ["Hadith 13's principle of loving for others what you love for yourself is echoed in other world traditions as a version of the 'Golden Rule' — a useful comparative point in broader Religious Studies discussions.", "Classical commentators note that Hadith 13's 'brother' extends beyond blood relations to the wider brotherhood of faith (Ukhuwwah Islamiyyah), and by extension to universal human dignity in many scholarly interpretations.", "Hadith 14 illustrates that Islamic law places extremely narrow, tightly defined limits on when life may lawfully be taken, and that such matters were never left to private individuals but required due process under legitimate authority."]}], "terms": [{"ar": "أَخ", "en": "Akh — brother (in faith)"}], "refs": [{"label": "Hadith 13 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:13", "title": null}, {"label": "Hadith 14 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:14", "title": null}]}, "practice": {"mcq": [{"q": "According to Hadith 13, true faith is shown when a person:", "options": ["Gives the most in charity", "Loves for others what he loves for himself", "Prays the most", "Fasts every day"], "answer": 1, "explain": "This Hadith links genuine Iman to empathy and goodwill toward others."}, {"q": "Hadith 14 primarily teaches about:", "options": ["The five pillars", "Rules of trade", "The sanctity/protection of a Muslim's life", "The rites of Hajj"], "answer": 2, "explain": "Hadith 14 establishes the high value and protection Islam gives to human life."}, {"q": "The main lesson from Hadith 13 for daily life is to:", "options": ["Avoid helping others", "Be selfish", "Focus only on personal gain", "Practise empathy and goodwill toward others"], "answer": 3, "explain": "The Hadith calls Muslims to genuine empathy and care for others, as for themselves."}, {"q": "Both Hadith 13 and 14 relate broadly to the theme of:", "options": ["Trade regulations", "Agricultural practices", "Astronomy", "Human relationships, empathy and the value of life"], "answer": 3, "explain": "Both Hadith address how Muslims should relate to and value one another."}], "theory": [{"q": "Explain the meaning and lesson of Hadith 13 of An-Nawawi's Collection, and describe how it can be applied to daily life.", "answer": "Should state the Hadith's meaning (loving for others what one loves for oneself) and give practical daily-life applications, e.g. fairness, generosity, avoiding harm to others."}]}}, {"num": 11, "title": "Jihad", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "A widely misunderstood term — Jihad means 'struggle' or 'striving', far broader than warfare alone.", "sections": [{"heading": "The Concept of Jihad", "points": ["Jihad literally means struggle or striving — exerting effort in the way of Allah to improve oneself and society.", "It is a broad concept covering personal, social and (in specific, regulated circumstances) military struggle — not simply 'holy war'."]}, {"heading": "Kinds of Jihad", "points": ["Jihadun-Nafs — struggle against one's own ego, desires and bad habits; considered the greatest Jihad.", "Jihad by the tongue — speaking the truth, enjoining good and forbidding evil, even when difficult.", "Jihad by wealth — spending generously in charity and for good causes.", "Jihad by the sword — a strictly regulated, defensive struggle historically undertaken only under legitimate leadership and clear ethical rules (protecting the defenceless, not harming non-combatants, honouring treaties)."]}, {"heading": "Jihadun-Nafs: The Greatest Jihad", "points": ["The Prophet ﷺ described the struggle against one's own desires as the greater Jihad, compared to external struggles.", "It involves resisting temptation, controlling anger, practising patience, and striving daily to improve one's character."]}, {"heading": "Deeper Insight: Common Misunderstandings", "points": ["Media portrayals often reduce 'Jihad' to armed conflict alone, but classical Islamic scholarship consistently ranks the struggle against one's own desires (Jihadun-Nafs) as greater and more demanding than any battlefield struggle.", "The four stages of Jihadun-Nafs, according to Ibn al-Qayyim, are: striving to learn true guidance, striving to act upon it, striving to teach it to others, and striving to remain patient through all three.", "WAEC essay questions on Jihad often specifically ask candidates to correct 'wrong notions of Jihad' — a strong answer distinguishes the broad linguistic meaning (struggle) from narrow, sensationalised media usage."]}], "terms": [{"ar": "جِهَادُ النَّفْس", "en": "Jihadun-Nafs — struggle against the self, the greatest Jihad"}], "refs": []}, "practice": {"mcq": [{"q": "The word 'Jihad' literally means:", "options": ["Pilgrimage", "Struggle or striving", "War", "Charity"], "answer": 1, "explain": "Jihad means to strive or struggle, a concept much broader than armed conflict alone."}, {"q": "Which kind of Jihad is considered the greatest according to the Prophet ﷺ?", "options": ["Jihad by wealth", "Jihad by the sword", "Jihadun-Nafs (struggle against the self)", "Jihad by the tongue"], "answer": 2, "explain": "The Prophet ﷺ taught that struggling against one's own ego and desires is the greatest Jihad."}, {"q": "Jihad by the tongue involves:", "options": ["Silence in all matters", "Physical combat", "Speaking the truth and enjoining good", "Giving money to charity only"], "answer": 2, "explain": "This form of Jihad involves standing for truth and encouraging good through speech."}, {"q": "Any form of armed Jihad in Islamic teaching is meant to be:", "options": ["Undertaken freely by any individual at will", "Strictly regulated, defensive, and under legitimate leadership with clear ethical limits", "Directed at non-combatants without restriction", "Optional and without any rules"], "answer": 1, "explain": "Classical Islamic teaching places strict ethical and legal limits on any armed struggle, requiring legitimate authority and protection of non-combatants."}], "theory": [{"q": "Discuss the various kinds of Jihad in Islam and explain why Jihadun-Nafs is regarded as the greatest.", "answer": "Should list the kinds (Nafs, tongue, wealth, sword) with brief descriptions, then explain why struggle against the self is regarded as greatest — its constancy and difficulty in daily life."}]}}, {"num": 12, "title": "Revision", "category": "Break", "isBreak": true, "breakNote": "Use this week to revisit every topic and re-take the Practice quizzes across all weeks of SS2 First Term.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 13, "title": "Examination", "category": "Break", "isBreak": true, "breakNote": "End-of-term examination week. No new lesson content.", "learn": {}, "practice": {"mcq": [], "theory": []}}]}, "ss3": {"label": "SS3", "full": "Senior Secondary School 3", "weeks": [{"num": 1, "title": "Revision of SS1 & SS2 Works", "category": "Break", "isBreak": true, "breakNote": "This week is dedicated to revising all SS1 and SS2 First Term topics. Visit the SS1 and SS2 classes to review Learn notes and retake Practice quizzes before the mock examination.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 2, "title": "Mock Examination", "category": "Break", "isBreak": true, "breakNote": "Mock examination week — no new lesson content. Use the Exam Mode on the Home dashboard to simulate a timed WAEC-style objective test.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 3, "title": "Mock Examination", "category": "Break", "isBreak": true, "breakNote": "Mock examination week (continued) — no new lesson content.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 4, "title": "Hadith 22nd, 23rd, 24th & 25th of An-Nawawi's Collection", "category": "Hadith", "isBreak": false, "breakNote": "", "learn": {"intro": "Four Hadith covering the path to Paradise, purity, divine justice, and equal reward for the poor.", "sections": [{"heading": "Hadith 22 — The Path to Paradise", "points": ["A man asked the Prophet ﷺ about deeds that would admit him to Paradise; the Prophet ﷺ listed the prescribed prayers, fasting Ramadan, paying Zakah, and avoiding what is unlawful.", "Lesson: fulfilling the core obligations sincerely, without adding to or reducing them, is sufficient for salvation."]}, {"heading": "Hadith 23 — Purity is Half of Faith", "points": ["The Prophet ﷺ taught that Taharah (purity) is half of Iman, and mentioned rewards for various remembrances of Allah (Alhamdulillah, SubhanAllah) and for patience.", "Lesson: both physical and spiritual purity are essential companions to strong faith."]}, {"heading": "Hadith 24 — Allah Forbids Injustice (Hadith Qudsi)", "points": ["In this Hadith Qudsi, Allah declares that He has forbidden injustice for Himself and made it forbidden among His servants — commanding them not to oppress one another.", "Lesson: justice is a divine command binding on every believer in all dealings."]}, {"heading": "Hadith 25 — Equal Reward Through Remembrance", "points": ["Poor companions complained to the Prophet ﷺ that the wealthy earned more reward through charity; he taught them to say Subhanallah, Alhamdulillah and Allahu Akbar after each prayer to attain equal reward.", "Lesson: acts of remembrance (Dhikr) are accessible worship available to everyone, regardless of wealth."]}, {"heading": "Deeper Insight: Threads Running Through These Hadith", "points": ["Hadith 22's list — prayer, fasting, Zakah, avoiding the unlawful — is sometimes called 'the balanced path', showing that sincere fulfilment of the basics, without excess or negligence, is what Islam asks of the average believer.", "Hadith 24 (the Hadith Qudsi on injustice) is considered one of the most quoted texts in Islamic discussions of social justice, human rights, and governance, since it applies to rulers and citizens alike.", "Hadith 25 shows the Prophet's ﷺ concern for economic inequality among his companions, offering the poor a path to spiritual equality with the wealthy through remembrance (Dhikr) rather than money."]}], "terms": [{"ar": "قُدْسِيّ", "en": "Qudsi — a Hadith whose meaning is from Allah, worded by the Prophet ﷺ"}, {"ar": "ذِكْر", "en": "Dhikr — remembrance of Allah"}], "refs": [{"label": "Hadith 22 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:22", "title": null}, {"label": "Hadith 23 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:23", "title": null}, {"label": "Hadith 24 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:24", "title": null}, {"label": "Hadith 25 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:25", "title": null}]}, "practice": {"mcq": [{"q": "In Hadith 22, the Prophet ﷺ lists which deeds as sufficient for entering Paradise?", "options": ["Only Hajj", "Only fasting", "Prescribed prayers, fasting Ramadan, paying Zakah, avoiding the unlawful", "Only Zakah"], "answer": 2, "explain": "The Hadith lists the core obligatory worships and avoidance of the forbidden as sufficient for salvation."}, {"q": "According to Hadith 23, Taharah (purity) is described as:", "options": ["Half of faith (Iman)", "A minor recommendation", "Only for scholars", "Unnecessary for worship"], "answer": 0, "explain": "The Hadith states that purity/cleanliness is 'half of faith'."}, {"q": "Hadith 24 is an example of which type of Hadith?", "options": ["A fabricated Hadith", "A weak (Da'if) Hadith", "Hadith Nabawi only", "Hadith Qudsi"], "answer": 3, "explain": "This Hadith reports Allah's own words as conveyed by the Prophet ﷺ, making it a Hadith Qudsi."}, {"q": "In Hadith 25, the poor were advised to gain equal reward to the rich through:", "options": ["Working harder for money", "Avoiding the mosque", "Saying Subhanallah, Alhamdulillah and Allahu Akbar after prayers", "Borrowing money to give charity"], "answer": 2, "explain": "The Prophet ﷺ taught them remembrances (Dhikr) after Salah as an accessible path to equal reward."}], "theory": [{"q": "Explain the lesson contained in Hadith 24 (the Hadith Qudsi on injustice) and discuss its relevance to society today.", "answer": "Should explain Allah's declaration forbidding injustice for Himself and among His servants, and relate this to modern issues like fairness in leadership, business, and personal dealings."}]}}, {"num": 5, "title": "Moral Lessons from the Qur'an and Hadith", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "Core character values every Muslim is taught to embody, drawn directly from scripture.", "sections": [{"heading": "Attitudes to Parents", "points": ["Q17:23-24 commands kindness to parents, forbidding even a word of contempt ('uff'), and to lower the 'wing of humility' toward them out of mercy.", "Q31:13-15 records Luqman's advice to his son, commanding gratitude to Allah and to parents, while drawing the line at obeying them in disobedience to Allah."]}, {"heading": "Honesty in Words and Deeds", "points": ["Q2:42 forbids mixing truth with falsehood or concealing the truth knowingly.", "Q61:2-3 strongly condemns saying what one does not do — a call for integrity between speech and action."]}, {"heading": "Dignity of Labour", "points": ["Islam honours honest work of any kind; the Prophet ﷺ taught that no one eats better food than that earned by the work of their own hands."]}, {"heading": "Unity and Brotherhood", "points": ["Q3:103 commands holding firmly to the rope of Allah together and not becoming divided.", "Q49:10 declares that believers are but brothers, so reconciliation between disputing believers is encouraged."]}, {"heading": "Modesty in Dressing and Behaviour", "points": ["Q24:30-31 instructs both believing men and women to lower their gaze and guard their modesty, and outlines guidelines for modest dress.", "Q17:32 warns against approaching illicit relationships, encouraging modesty as protection for individuals and society."]}, {"heading": "Deeper Insight: Character as the Core of Faith", "points": ["The Prophet ﷺ summarised his own mission in a well-known Hadith: 'I was only sent to perfect good character' — tying these moral lessons directly to the purpose of his Prophethood.", "Luqman's advice in Q31 is delivered as a father-to-son conversation, making it one of the Qur'an's most personal and relatable passages on moral upbringing — often quoted in discussions of parenting in Islam.", "WAEC essay questions frequently ask for 'two Qur'anic references' on a moral topic — always pair the Surah/verse number with a short paraphrase of its meaning, not just the reference number alone."]}], "terms": [], "refs": [{"label": "Q17:23-24", "url": "https://quran.com/17/23-24", "title": null}, {"label": "Q31:13-15", "url": "https://quran.com/31/13-15", "title": null}, {"label": "Q2:42", "url": "https://quran.com/2/42", "title": null}, {"label": "Q61:2-3", "url": "https://quran.com/61/2-3", "title": null}, {"label": "Q3:103", "url": "https://quran.com/3/103", "title": null}, {"label": "Q49:10", "url": "https://quran.com/49/10", "title": null}, {"label": "Q17:32", "url": "https://quran.com/17/32", "title": null}, {"label": "Q24:30-31", "url": "https://quran.com/24/30-31", "title": null}]}, "practice": {"mcq": [{"q": "Q17:23-24 teaches Muslims to treat their parents with:", "options": ["Distance in old age", "Indifference", "Strict obedience in all matters without exception", "Kindness and humility, even avoiding a word of contempt"], "answer": 3, "explain": "The verse commands kindness and humility toward parents, forbidding even the mildest disrespect."}, {"q": "According to Q61:2-3, Allah strongly dislikes:", "options": ["Prayer", "Fasting", "Saying what one does not do", "Charity"], "answer": 2, "explain": "The verses condemn the gap between speech and action — saying what one does not practise."}, {"q": "Q3:103 encourages believers to:", "options": ["Hold firmly to the rope of Allah together and avoid division", "Focus only on individual worship", "Separate into rival groups", "Compete for leadership"], "answer": 0, "explain": "The verse calls for unity among believers, avoiding factionalism."}, {"q": "Q24:30-31 primarily addresses:", "options": ["Rules of trade", "Modesty in gaze, dress and behaviour", "Inheritance shares", "Rules of Hajj"], "answer": 1, "explain": "These verses instruct both men and women on lowering the gaze and dressing/behaving modestly."}], "theory": [{"q": "Using relevant Qur'anic references, discuss the Islamic teaching on honesty in words and deeds, and on unity and brotherhood among Muslims.", "answer": "Should cite Q2:42/Q61:2-3 for honesty, and Q3:103/Q49:10 for unity/brotherhood, with explanation of each teaching's practical application."}]}}, {"num": 6, "title": "Hadith 26th, 27th & 28th of An-Nawawi's Collection", "category": "Hadith", "isBreak": false, "breakNote": "", "learn": {"intro": "Three Hadith on everyday charity, the nature of righteousness, and following the Prophet's example.", "sections": [{"heading": "Hadith 26 — Every Joint Owes a Charity", "points": ["The Prophet ﷺ taught that every joint of the human body owes a charity each day the sun rises: doing justice between two people, helping someone onto their mount, a good word, removing a harmful object from a path — even a good word or smile counts as charity.", "Lesson: charity (Sadaqah) is not limited to money — countless small daily acts of kindness qualify."]}, {"heading": "Hadith 27 — Righteousness is Good Character", "points": ["'Righteousness is good character, and sin is that which wavers in your soul and which you dislike people finding out about.'", "Lesson: a person's own conscience often signals right from wrong; sin creates unease and a desire for secrecy."]}, {"heading": "Hadith 28 — Hold Fast to the Sunnah", "points": ["The Prophet ﷺ advised holding firmly to his Sunnah and that of the rightly-guided Caliphs after him, warning against newly invented matters (innovations) in religion.", "Lesson: staying anchored to authentic, established teaching protects the believer from misguidance."]}, {"heading": "Deeper Insight: Small Acts, Real Impact", "points": ["Hadith 26's list of daily charities — justice, helping someone up, a good word, removing harm from a path — shows that Sadaqah is accessible to every person regardless of wealth, a theme connecting back to Hadith 25 from the previous topic.", "Hadith 27's definition of sin as 'what wavers in the soul' has influenced Islamic counselling approaches, which often encourage self-reflection on unease of conscience as an early warning sign.", "Hadith 28's warning against religious innovation (Bid'ah) is a foundational text for Islamic methodology (Usul), often cited alongside Hadith 1 (on intentions) as one of the most quoted Hadith in Islamic scholarship."]}], "terms": [{"ar": "صَدَقَة", "en": "Sadaqah — voluntary charity"}, {"ar": "بِدْعَة", "en": "Bid'ah — religious innovation"}], "refs": [{"label": "Hadith 26 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:26", "title": null}, {"label": "Hadith 27 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:27", "title": null}, {"label": "Hadith 28 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:28", "title": null}]}, "practice": {"mcq": [{"q": "According to Hadith 26, which of these counts as a charity from a person?", "options": ["A good word or removing a harmful object from a path", "Only performing Hajj", "Only giving money", "Only fasting"], "answer": 0, "explain": "The Hadith broadens 'charity' to include everyday acts of kindness, not just money."}, {"q": "Hadith 27 defines righteousness as:", "options": ["Wealth and status", "Physical strength", "Good character", "Knowledge alone"], "answer": 2, "explain": "The Hadith states plainly that righteousness (Birr) is good character."}, {"q": "According to Hadith 27, sin is described as something that:", "options": ["Wavers in the soul and one dislikes others discovering", "Feels comfortable and is openly shared", "Is always legally punishable", "Has no effect on conscience"], "answer": 0, "explain": "The Hadith describes sin as causing unease in the soul and a desire to hide it from others."}, {"q": "Hadith 28 advises Muslims to hold fast to:", "options": ["The Sunnah of the Prophet ﷺ and the rightly-guided Caliphs", "Newly invented practices", "Only the practices of one's own family", "Personal opinions only"], "answer": 0, "explain": "The Hadith emphasises adherence to the authentic Sunnah and warns against religious innovation."}], "theory": [{"q": "Explain the meaning of Hadith 26 of An-Nawawi's Collection and list four examples of daily acts that qualify as charity according to it.", "answer": "Should explain the concept that every joint owes charity daily, and list examples such as justice between people, helping someone, removing harm from a path, and a good word."}]}}, {"num": 7, "title": "Mid-Term Tests / Open Day", "category": "Break", "isBreak": true, "breakNote": "No new lesson this week — mid-term tests, open day and mid-term holiday. Use this time to revise Weeks 4–6.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 8, "title": "Nikah: Marriage in Islam", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "Marriage as a sacred contract that builds family and society in Islam.", "sections": [{"heading": "Rights and Duties of Husband and Wife", "points": ["A husband is responsible for the maintenance (Nafaqah), protection and kind treatment of his wife (Q4:34, Q2:228).", "A wife has the right to fair treatment, respect, and her agreed dowry (Mahr); both spouses owe each other mutual rights and kindness (Q30:21).", "Islam explicitly forbids the ill-treatment of a wife (Idrar) — Q65:6 commands housing and treating her decently, without harming or restricting her unjustly."]}, {"heading": "The Status of Women in Islam", "points": ["Islam elevated women's status compared to Jahiliyyah practices — granting rights to inheritance, consent in marriage, education, and ownership of property.", "Q33:33 and Q4:34 outline complementary roles for men and women within the family, not a claim that either is without value or rights."]}, {"heading": "Islam's Position on Polygamy", "points": ["The Qur'an permits marriage to up to four wives at a time (Q4:3), but conditions this strictly on the ability to treat all wives with justice and fairness.", "Polygamy is not a religious obligation — a man unable to guarantee fairness is instructed to marry only one.", "The rules governing it exist to protect women's rights, not to disadvantage them."]}, {"heading": "Deeper Insight: Marriage as a Balanced Contract", "points": ["Nikah in Islam is legally structured as a contract (' Aqd) requiring offer and acceptance (Ijab and Qabul), witnesses, and a specified Mahr — distinguishing it clearly from informal cohabitation.", "Islam's reforms to marriage in 7th-century Arabia — requiring a woman's consent, guaranteeing her right to her own Mahr and property, and capping polygamy at four with a strict justice condition — were significant advances for their time.", "Modern Islamic family law across different countries varies in how strictly it enforces the justice condition for polygamy; some jurisdictions require a wife's consent or court approval before a husband may marry again."]}], "terms": [{"ar": "نِكَاح", "en": "Nikah — marriage"}, {"ar": "مَهْر", "en": "Mahr — dowry"}, {"ar": "نَفَقَة", "en": "Nafaqah — maintenance/upkeep"}], "refs": [{"label": "Q4:34", "url": "https://quran.com/4/34", "title": null}, {"label": "Q2:228", "url": "https://quran.com/2/228", "title": null}, {"label": "Q65:6", "url": "https://quran.com/65/6", "title": null}, {"label": "Q20:132", "url": "https://quran.com/20/132", "title": null}, {"label": "Q33:33", "url": "https://quran.com/33/33", "title": null}, {"label": "Q41:34", "url": "https://quran.com/41/34", "title": null}, {"label": "Q4:3", "url": "https://quran.com/4/3", "title": null}]}, "practice": {"mcq": [{"q": "Under Islamic law, who is primarily responsible for the maintenance (Nafaqah) of the family?", "options": ["The husband", "The wife alone", "The extended family only", "The state alone"], "answer": 0, "explain": "The husband bears the primary responsibility for maintaining his wife and family."}, {"q": "Q65:6 primarily addresses:", "options": ["Prohibition of ill-treatment (Idrar) of a wife", "Fasting rules", "Rules of Hajj", "Zakat calculation"], "answer": 0, "explain": "Q65:6 commands decent housing and treatment of a wife, forbidding harm or restriction."}, {"q": "According to the Qur'an, a man wishing to practise polygamy must be able to:", "options": ["Marry as many wives as he wants without conditions", "Treat all his wives with justice and fairness", "Avoid providing maintenance", "Only consider his own convenience"], "answer": 1, "explain": "Q4:3 conditions polygamy strictly on the husband's ability to be just and fair to all wives."}, {"q": "Compared to Jahiliyyah practices, Islam's teaching on women's status:", "options": ["Elevated women's rights, e.g. inheritance and marriage consent", "Only applied to wealthy women", "Made no difference at all", "Reduced women's rights further"], "answer": 0, "explain": "Islam granted women rights (inheritance, consent, property) that were largely denied in pre-Islamic Arabia."}], "theory": [{"q": "Discuss the rights and duties of husband and wife in Islam, and explain the conditions Islam places on polygamy.", "answer": "Should cover mutual rights/duties (maintenance, kindness, no ill-treatment) and explain the justice condition for polygamy from Q4:3."}]}}, {"num": 9, "title": "Muslim Sages I: Jabir ibn Hayyan & Al-Razi", "category": "Tarikh", "isBreak": false, "breakNote": "", "learn": {"intro": "Two towering figures whose work in chemistry and medicine shaped both the Muslim world and later European science.", "sections": [{"heading": "Jabir ibn Hayyan (c. 721-815 CE)", "points": ["Often called the 'father of chemistry' for pioneering systematic, experimental methods in the science of his time.", "Developed and refined laboratory techniques still fundamental today, including distillation, crystallization, and filtration.", "His written works influenced the development of chemistry (then called alchemy) for centuries, including in medieval Europe."]}, {"heading": "Muhammad ibn Zakariya al-Razi (c. 865-925 CE)", "points": ["A brilliant physician and philosopher, regarded as a pioneer of clinical, experience-based medicine.", "Famous for being the first to clearly distinguish smallpox from measles as separate diseases.", "Authored 'Al-Hawi' (The Comprehensive Book), a vast medical encyclopaedia widely used and translated in Europe for centuries."]}, {"heading": "Deeper Insight: Their Lasting Legacy", "points": ["Jabir ibn Hayyan's works were translated into Latin in medieval Europe under the name 'Geber', and the word 'gibberish' is even said by some etymologists to derive from readers struggling with his coded alchemical Latin texts.", "Al-Razi insisted on bedside clinical observation over blind reliance on old texts, keeping detailed case notes — an early form of the scientific method in medicine, centuries before it became standard practice in Europe.", "Both scholars worked during the Abbasid 'Golden Age' (8th-13th century), when the House of Wisdom (Bayt al-Hikmah) in Baghdad became a leading centre of science, translation and scholarship."]}], "terms": [], "refs": []}, "practice": {"mcq": [{"q": "Jabir ibn Hayyan is often referred to as the 'father of' which science?", "options": ["Geography", "Chemistry", "Mathematics", "Astronomy"], "answer": 1, "explain": "He pioneered experimental methods that laid foundations for modern chemistry."}, {"q": "Which laboratory technique is Jabir ibn Hayyan credited with refining?", "options": ["Distillation", "Printing", "Photography", "Navigation"], "answer": 0, "explain": "He developed key techniques including distillation and crystallization."}, {"q": "Al-Razi is particularly known in medical history for:", "options": ["Inventing the printing press", "Discovering gravity", "Distinguishing smallpox from measles", "Mapping the solar system"], "answer": 2, "explain": "Al-Razi was the first to clearly differentiate these two diseases in his medical writings."}, {"q": "Al-Razi's famous medical encyclopaedia is titled:", "options": ["Al-Hawi", "Ihya Ulum ad-Din", "Al-Muqaddimah", "Al-Qanun"], "answer": 0, "explain": "'Al-Hawi' (The Comprehensive Book) was Al-Razi's major medical work."}], "theory": [{"q": "Discuss the contributions of Jabir ibn Hayyan and Al-Razi to science, and their relevance to the modern world.", "answer": "Should describe Jabir's experimental chemistry techniques and Al-Razi's clinical medical contributions, and note their lasting influence on modern science and medicine."}]}}, {"num": 10, "title": "Muslim Sages II: Ibn Sina & Al-Ghazali", "category": "Tarikh", "isBreak": false, "breakNote": "", "learn": {"intro": "A physician-philosopher and a theologian-philosopher whose ideas reached far beyond the Muslim world.", "sections": [{"heading": "Ibn Sina / Avicenna (980-1037 CE)", "points": ["A physician and philosopher whose medical encyclopaedia, 'Al-Qanun fit-Tibb' (The Canon of Medicine), was a standard medical textbook in Europe for centuries.", "Made significant contributions to philosophy, logic, and the natural sciences alongside medicine.", "His work bridged Islamic scholarship with later European Renaissance thought."]}, {"heading": "Muhammad ibn Muhammad al-Ghazali (1058-1111 CE)", "points": ["A renowned theologian and philosopher, honoured with the title Hujjatul-Islam ('Proof of Islam') for his influential scholarship.", "His major work, 'Ihya' Ulumid-Din' (The Revival of the Religious Sciences), reconciled Islamic law and theology with the spiritual dimensions of Sufism.", "His writings continue to shape Islamic theology, ethics and spirituality today."]}, {"heading": "Deeper Insight: Their Lasting Legacy", "points": ["Ibn Sina's Canon of Medicine remained a standard textbook in European universities, including Montpellier and Padua, until as late as the 17th century — an extraordinary six centuries of influence.", "Al-Ghazali's personal spiritual crisis, described in his autobiography 'Al-Munqidh minad-Dalal' (Deliverance from Error), led him to temporarily abandon teaching in Baghdad to pursue direct spiritual experience — a story often cited in discussions of faith and doubt.", "Both scholars show that Islamic civilisation valued the integration of reason, empirical science and faith, rather than treating them as opposed — a point often raised in essay questions on the contribution of Muslim scholars to world civilisation."]}], "terms": [{"ar": "حُجَّةُ الإِسْلَام", "en": "Hujjatul-Islam — 'Proof of Islam', a title given to al-Ghazali"}], "refs": []}, "practice": {"mcq": [{"q": "Ibn Sina's famous medical work, used in Europe for centuries, is called:", "options": ["Al-Hawi", "Al-Qanun fit-Tibb (The Canon of Medicine)", "Al-Muqaddimah", "Ihya Ulum ad-Din"], "answer": 1, "explain": "'The Canon of Medicine' was Ibn Sina's major medical encyclopaedia."}, {"q": "Al-Ghazali was given the honorary title:", "options": ["Amirul-Mu'minin", "Al-Amin", "Hujjatul-Islam (Proof of Islam)", "Khalifatullah"], "answer": 2, "explain": "He was honoured as 'Hujjatul-Islam' for his influential scholarship."}, {"q": "Al-Ghazali's major work 'Ihya' Ulumid-Din' primarily addresses:", "options": ["Mathematics", "Reconciling Islamic law/theology with the spiritual dimensions of Sufism", "Astronomy", "Military strategy"], "answer": 1, "explain": "'The Revival of the Religious Sciences' bridges Islamic law/theology with spirituality."}, {"q": "Besides medicine, Ibn Sina also made contributions to:", "options": ["Only agriculture", "Only poetry", "Philosophy and logic", "Only architecture"], "answer": 2, "explain": "Ibn Sina was also a significant philosopher and logician, beyond his medical work."}], "theory": [{"q": "Discuss the contributions of Ibn Sina and Al-Ghazali to Islamic and world civilisation.", "answer": "Should cover Ibn Sina's medical and philosophical contributions, and Al-Ghazali's theological work reconciling law and Sufism, noting their lasting global influence."}]}}, {"num": 11, "title": "Revision", "category": "Break", "isBreak": true, "breakNote": "Use this week to revisit every topic and re-take the Practice quizzes across all weeks of SS3 First Term.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 12, "title": "Examination", "category": "Break", "isBreak": true, "breakNote": "End-of-term examination week (continues into Week 13). No new lesson content.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 13, "title": "Examination", "category": "Break", "isBreak": true, "breakNote": "End-of-term examination week. No new lesson content.", "learn": {}, "practice": {"mcq": [], "theory": []}}]}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('content-data').textContent);
var CLASS_KEYS = ["ss1","ss2","ss3"];

/* ---------------- State ---------------- */
var STORE_KEY = "hybraheeem_academy_v1";
var ADMIN_KEY = "hybraheeem_admin_v1";
function loadState(){
  var s = { name:"", theme:"light", fscale:1, progress:{}, lastVisit:null, examHistory:[], comments:[] };
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) Object.assign(s, JSON.parse(raw));
  }catch(e){}
  if(!s.examHistory) s.examHistory = [];
  if(!s.comments) s.comments = [];
  if(!s.progress) s.progress = {};
  return s;
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
}
var S = loadState();

function loadAdmin(){
  try{
    var raw = localStorage.getItem(ADMIN_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { records: [] };
}
function saveAdmin(A){
  try{ localStorage.setItem(ADMIN_KEY, JSON.stringify(A)); }catch(e){}
}

var view = { screen:"home", cls:null, week:null, tab:"learn", exam:null };

/* ---------------- Helpers ---------------- */
function el(sel,ctx){ return (ctx||document).querySelector(sel); }
function els(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nl2li(points){ return points.map(function(p){ return "<li>"+esc(p)+"</li>"; }).join(""); }
function fmtDate(ts){ try{ return new Date(ts).toLocaleString(); }catch(e){ return ""; } }

function classProgress(clsKey){
  var cls = DATA[clsKey];
  var contentWeeks = cls.weeks.filter(function(w){ return !w.isBreak; });
  var done = 0;
  contentWeeks.forEach(function(w){
    var p = getWeekProgress(clsKey, w.num);
    if(p.quizBest !== null && p.quizBest !== undefined) done++;
  });
  return { done: done, total: contentWeeks.length, pct: contentWeeks.length ? Math.round(done/contentWeeks.length*100) : 0 };
}
function getWeekProgress(clsKey, weekNum){
  var key = clsKey+"-"+weekNum;
  if(!S.progress[key]) S.progress[key] = { learnSeen:false, quizBest:null, attempts:0, theoryDraft:{} };
  return S.progress[key];
}
function setWeekProgress(clsKey, weekNum, patch){
  var p = getWeekProgress(clsKey, weekNum);
  Object.assign(p, patch);
  saveState();
}
function findWeek(clsKey, weekNum){
  return DATA[clsKey].weeks.find(function(w){ return w.num === weekNum; });
}
function overallStats(){
  var totalDone=0, totalWeeks=0;
  CLASS_KEYS.forEach(function(c){ var p=classProgress(c); totalDone+=p.done; totalWeeks+=p.total; });
  return {done:totalDone,total:totalWeeks};
}
function lastVisitTarget(){ return S.lastVisit; }

function allMCQs(){
  var out = [];
  CLASS_KEYS.forEach(function(c){
    DATA[c].weeks.forEach(function(w){
      if(w.isBreak) return;
      w.practice.mcq.forEach(function(q){ out.push({cls:c, week:w.num, title:w.title, q:q}); });
    });
  });
  return out;
}
function questionOfDay(){
  var pool = allMCQs();
  var day = Math.floor(Date.now()/86400000);
  return pool[day % pool.length];
}

/* ---------------- Icons ---------------- */
function ringSVG(pct, size){
  size = size || 58;
  var r = (size/2)-6, c = 2*Math.PI*r;
  var off = c - (c*pct/100);
  return '<svg class="ring" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="6"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" '+
      'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="53%" text-anchor="middle" font-size="'+(size*0.28)+'" font-family="Karla" font-weight="700" fill="var(--text)">'+pct+'%</text>'+
  '</svg>';
}
var ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5c2-1 5-1 8 0v14c-3-1-6-1-8 0z"/><path d="M20 5c-2-1-5-1-8 0v14c3-1 6-1 8 0z"/></svg>';

/* ---------------- Top nav ---------------- */
function renderTopNav(){
  var tabs = [["home","Home"]];
  CLASS_KEYS.forEach(function(c){ tabs.push([c, DATA[c].label]); });
  tabs.push(["exam","Exam Mode"]);
  el("#navTabs").innerHTML = tabs.map(function(t){
    var active = (view.screen==="home"&&t[0]==="home") || (view.cls===t[0]) || (view.screen==="exam"&&t[0]==="exam");
    return '<button data-nav="'+t[0]+'" class="'+(active?"active":"")+'">'+t[1]+'</button>';
  }).join("");
  els('[data-nav]').forEach(function(b){
    b.onclick = function(){
      var v = b.getAttribute('data-nav');
      if(v==="home") goHome();
      else if(v==="exam") goExamSetup();
      else goClass(v);
    };
  });
  var initials = (S.name||"?").trim().charAt(0).toUpperCase() || "?";
  el("#nameChip").innerHTML = '<span class="dot">'+esc(initials)+'</span><span>'+esc(S.name||"Student")+'</span>';
  el("#nameChip").onclick = function(){ openNameModal(true); };
}

/* ---------------- Sidebar ---------------- */
function renderSidebar(){
  var sb = el("#sidebar");
  if(!view.cls){ sb.classList.add("hidden"); sb.innerHTML=""; return; }
  sb.classList.remove("hidden");
  var cls = DATA[view.cls];
  var prog = classProgress(view.cls);
  var html = '<div class="sb-head"><h3>'+cls.label+' &middot; First Term</h3></div>'+
    '<div class="sb-progress-track"><div class="sb-progress-fill" style="width:'+prog.pct+'%"></div></div>';
  html += cls.weeks.map(function(w){
    var wp = getWeekProgress(view.cls, w.num);
    var status = "todo";
    if(!w.isBreak){
      if(wp.quizBest !== null && wp.quizBest !== undefined) status = "done";
      else if(wp.learnSeen) status = "progress";
    }
    var active = view.week === w.num;
    return '<div class="week-item '+(w.isBreak?"break":"")+' '+(active?"active":"")+'" data-week="'+w.num+'">'+
      '<div class="wk-num">'+w.num+'</div>'+
      '<div class="wk-title">'+esc(w.title)+'</div>'+
      (w.isBreak ? '' : '<div class="wk-status '+status+'"></div>') +
      '</div>';
  }).join("");
  sb.innerHTML = html;
  els('.week-item', sb).forEach(function(item){
    item.onclick = function(){ goWeek(view.cls, parseInt(item.getAttribute('data-week'),10)); };
  });
}

/* ---------------- Screens: HOME ---------------- */
function goHome(){
  view = { screen:"home", cls:null, week:null, tab:"learn", exam:null };
  renderAll();
}
function renderHome(){
  var stats = overallStats();
  var qd = questionOfDay();
  var lv = lastVisitTarget();
  var html = '';
  html += '<div class="hero">'+
    '<svg class="hero-star" viewBox="0 0 64 64"><polygon points="32,4 39,25 61,25 43,38 50,60 32,47 14,60 21,38 3,25 25,25" fill="var(--gold)"/></svg>'+
    '<div class="sub">ISLAMIC STUDIES &middot; SS1&ndash;SS3 &middot; FIRST TERM</div>'+
    '<h1>Assalamu Alaikum'+(S.name?", "+esc(S.name):"")+'.</h1>'+
    '<p>Learn the Qur&rsquo;an, Hadith, Tarikh and Fiqh topics of your First Term syllabus &mdash; built from your school&rsquo;s scheme of work and the WAEC Islamic Studies syllabus.</p>'+
    (stats.total ? '<p style="color:var(--gold-light); font-weight:700; margin-top:14px;">'+stats.done+' of '+stats.total+' topics completed across all classes</p>' : '') +
    '</div>';

  if(lv && findWeek(lv.cls, lv.week)){
    var w = findWeek(lv.cls, lv.week);
    html += '<div class="continue-card">'+
      '<div class="cc-icon">'+ICON_BOOK+'</div>'+
      '<div class="cc-text"><small>Continue where you left off</small><b>'+DATA[lv.cls].label+' &middot; Week '+w.num+': '+esc(w.title)+'</b></div>'+
      '<button class="btn primary" id="continueBtn">Continue</button>'+
      '</div>';
  }

  html += '<div class="section-label">CHOOSE YOUR CLASS</div>';
  html += '<div class="grid cols-3">';
  CLASS_KEYS.forEach(function(c){
    var p = classProgress(c);
    html += '<div class="card class-card" data-goclass="'+c+'">'+
      '<h3>'+DATA[c].label+'</h3>'+
      '<div class="cc-full">'+esc(DATA[c].full)+' &middot; First Term</div>'+
      '<div class="ring-wrap">'+ringSVG(p.pct)+'<div class="ring-label">Topics done<b>'+p.done+' / '+p.total+'</b></div></div>'+
      '</div>';
  });
  html += '</div>';

  html += '<div class="section-label">TODAY&rsquo;S PRACTICE</div>';
  html += '<div class="grid cols-2">';
  html += '<div class="card qotd" id="qotdCard">'+
    '<h4>Question of the Day &mdash; '+DATA[qd.cls].label+', Week '+qd.week+'</h4>'+
    '<div style="font-family:Amiri,serif; font-size:1.05rem; margin-bottom:6px;">'+esc(qd.q.q)+'</div>'+
    '<div class="q-options" id="qotdOptions">'+
      qd.q.options.map(function(o,i){ return '<div class="qotd-opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>'; }).join("")+
    '</div>'+
    '<div id="qotdFeedback"></div>'+
    '</div>';
  html += '<div class="card exam-card">'+
    '<h3>Exam Mode</h3>'+
    '<p>Take a timed, WAEC-style objective test pulling questions from one or all classes. Great for revision before tests.</p>'+
    '<button class="btn gold" id="examBtn">Start Exam Mode</button>'+
    '</div>';
  html += '</div>';

  html += '<div class="section-label">FEEDBACK TO YOUR TEACHER</div>';
  html += '<div class="card">'+
    '<p style="margin-bottom:10px;">Have a question, correction, or something you found difficult? Leave a note here &mdash; it will be included when you export your results for your teacher.</p>'+
    '<textarea id="commentInput" placeholder="Type your comment or question..." style="width:100%; min-height:80px; border-radius:var(--radius-s); border:1px solid var(--border); padding:10px 12px; font-family:inherit; background:var(--surface); color:var(--text);"></textarea>'+
    '<div class="btn-row"><button class="btn primary" id="commentSubmit">Send to Teacher</button>'+
    (S.comments.length ? '<span style="align-self:center; color:var(--text-soft); font-size:.82rem;">'+S.comments.length+' comment(s) saved</span>' : '')+
    '</div></div>';

  el("#content").innerHTML = html;

  if(el("#continueBtn")) el("#continueBtn").onclick = function(){ goWeek(lv.cls, lv.week); };
  els('[data-goclass]').forEach(function(card){ card.onclick = function(){ goClass(card.getAttribute('data-goclass')); }; });
  el("#examBtn").onclick = goExamSetup;
  els('.qotd-opt').forEach(function(opt){
    opt.onclick = function(){
      if(el("#qotdOptions").getAttribute('data-answered')) return;
      el("#qotdOptions").setAttribute('data-answered','1');
      var i = parseInt(opt.getAttribute('data-i'),10);
      var isCorrect = i === qd.q.answer;
      els('.qotd-opt').forEach(function(o,idx){
        if(idx===qd.q.answer) o.classList.add('correct');
        else if(idx===i) o.classList.add('wrong');
      });
      el("#qotdFeedback").innerHTML = '<div class="explain-box '+(isCorrect?"":"wrong")+'" style="margin-top:12px;"><b>'+(isCorrect?"Correct! ":"Not quite. ")+'</b>'+esc(qd.q.explain)+'</div>';
    };
  });
  el("#commentSubmit").onclick = function(){
    var v = el("#commentInput").value.trim();
    if(!v) return;
    S.comments.push({ message:v, timestamp: Date.now(), context: "Home / General" });
    saveState();
    el("#commentInput").value = "";
    renderHome();
  };
}

/* ---------------- Screens: CLASS / WEEK ---------------- */
function goClass(clsKey){
  var cls = DATA[clsKey];
  var firstContent = cls.weeks.find(function(w){ return !w.isBreak; });
  view = { screen:"week", cls:clsKey, week: firstContent.num, tab:"learn", exam:null };
  S.lastVisit = { cls: clsKey, week: firstContent.num }; saveState();
  renderAll();
}
function goWeek(clsKey, weekNum){
  view = { screen:"week", cls:clsKey, week: weekNum, tab:"learn", exam:null };
  S.lastVisit = { cls: clsKey, week: weekNum }; saveState();
  renderAll();
}

function renderWeek(){
  var w = findWeek(view.cls, view.week);
  var clsLabel = DATA[view.cls].label;
  var content = el("#content");

  if(w.isBreak){
    content.innerHTML =
      '<div class="crumb">'+clsLabel+' / Week '+w.num+'</div>'+
      '<div class="week-head"><h2>'+esc(w.title)+'</h2></div>'+
      '<div class="break-card"><div class="bicon">&#128218;</div><h3>'+esc(w.title)+'</h3><p style="max-width:460px; margin:0 auto; color:var(--text-soft);">'+esc(w.breakNote)+'</p></div>';
    return;
  }

  setWeekProgress(view.cls, w.num, { learnSeen:true });

  var html = '<div class="crumb">'+clsLabel+' / Week '+w.num+' of 13</div>';
  html += '<div class="week-head"><div><span class="cat-pill">'+esc(w.category)+'</span><h2>'+esc(w.title)+'</h2></div></div>';
  html += '<div class="tabbar">'+
    '<button data-tab="learn" class="'+(view.tab==="learn"?"active":"")+'">Learn</button>'+
    '<button data-tab="practice" class="'+(view.tab==="practice"?"active":"")+'">Practice</button>'+
    '</div>';
  html += '<div id="tabPane"></div>';
  content.innerHTML = html;

  els('[data-tab]').forEach(function(b){
    b.onclick = function(){ view.tab = b.getAttribute('data-tab'); renderWeek(); };
  });

  if(view.tab === "learn") renderLearnTab(w); else renderPracticeTab(w);
}

function renderLearnTab(w){
  var pane = el("#tabPane");
  var html = '<div class="learn-intro">'+esc(w.learn.intro||"")+'</div>';
  (w.learn.sections||[]).forEach(function(s){
    html += '<div class="lesson-section"><h4>'+esc(s.heading)+'</h4><ul>'+nl2li(s.points)+'</ul></div>';
  });
  if(w.learn.terms && w.learn.terms.length){
    html += '<div class="terms-box"><h4>Key Terms</h4>';
    w.learn.terms.forEach(function(t){
      html += '<div class="term-row"><div class="term-ar">'+t.ar+'</div><div class="term-en">'+esc(t.en)+'</div></div>';
    });
    html += '</div>';
  }
  if(w.learn.refs && w.learn.refs.length){
    html += '<div class="refs-row">'+w.learn.refs.map(function(r){
      if(r.url){
        return '<a class="ref-chip" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.title||("Read further: "+r.label))+'">'+esc(r.label)+' &#8599;</a>';
      }
      return '<span class="ref-chip" style="opacity:.6; cursor:default;" title="'+esc(r.title||"")+'">'+esc(r.label)+'</span>';
    }).join("")+'</div>';
  }
  html += '<div class="btn-row"><button class="btn primary" id="toPractice">Go to Practice &rarr;</button></div>';
  pane.innerHTML = html;
  el("#toPractice").onclick = function(){ view.tab="practice"; renderWeek(); };
}

function renderPracticeTab(w){
  var pane = el("#tabPane");
  var qKey = "quizState";
  if(!view[qKey] || view[qKey].weekKey !== (view.cls+"-"+w.num)){
    view[qKey] = { weekKey: view.cls+"-"+w.num, idx:0, answers:new Array(w.practice.mcq.length).fill(null), finished:false };
  }
  var qs = view[qKey];

  var html = '';
  if(!w.practice.mcq.length){
    html += '<p style="color:var(--text-soft)">No objective questions for this week yet.</p>';
  } else if(!qs.finished){
    html += renderQuizQuestion(w, qs);
  } else {
    html += renderQuizScore(w, qs);
  }

  if(w.practice.theory && w.practice.theory.length){
    html += '<div class="section-label">THEORY / ESSAY PRACTICE</div>';
    w.practice.theory.forEach(function(t, ti){
      var pkey = "t"+ti;
      var wp = getWeekProgress(view.cls, w.num);
      var draft = (wp.theoryDraft && wp.theoryDraft[pkey]) || "";
      html += '<div class="card theory-card">'+
        '<div class="q-text" style="font-size:1rem; margin-bottom:10px;">'+esc(t.q)+'</div>'+
        '<textarea data-theory="'+pkey+'" placeholder="Write your own answer here (optional) before checking the model answer...">'+esc(draft)+'</textarea>'+
        '<div class="btn-row"><button class="btn ghost" data-reveal="'+pkey+'">Show model answer</button></div>'+
        '<div class="model-answer" id="model-'+pkey+'">'+esc(t.answer)+'</div>'+
        '</div>';
    });
  }

  pane.innerHTML = html;
  wireQuizEvents(w, qs);

  els('[data-theory]').forEach(function(ta){
    ta.oninput = function(){
      var wp = getWeekProgress(view.cls, w.num);
      if(!wp.theoryDraft) wp.theoryDraft = {};
      wp.theoryDraft[ta.getAttribute('data-theory')] = ta.value;
      saveState();
    };
  });
  els('[data-reveal]').forEach(function(btn){
    btn.onclick = function(){
      var id = "model-"+btn.getAttribute('data-reveal');
      el("#"+id).classList.toggle('shown');
      btn.textContent = el("#"+id).classList.contains('shown') ? "Hide model answer" : "Show model answer";
    };
  });
}

function renderQuizQuestion(w, qs){
  var total = w.practice.mcq.length;
  var q = w.practice.mcq[qs.idx];
  var answered = qs.answers[qs.idx] !== null;

  var dots = '<div class="quiz-progress">';
  for(var i=0;i<total;i++){
    var cls = "qp-dot";
    if(qs.answers[i]!==null){ cls += (qs.answers[i]===w.practice.mcq[i].answer) ? " correct" : " wrong"; }
    else if(i===qs.idx) cls += " current";
    dots += '<div class="'+cls+'">'+(i+1)+'</div>';
  }
  dots += '</div>';

  var html = dots + '<div class="card q-card">';
  html += '<div class="q-text">'+esc(q.q)+'</div>';
  html += '<div class="opt-list">';
  q.options.forEach(function(opt, i){
    var cls = "opt";
    if(answered){
      if(i === q.answer) cls += " correct-answer";
      else if(i === qs.answers[qs.idx]) cls += " wrong-answer";
    }
    html += '<button class="'+cls+'" data-opt="'+i+'" '+(answered?"disabled":"")+'>'+
      '<span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(opt)+'</span></button>';
  });
  html += '</div>';
  if(answered){
    var isCorrect = qs.answers[qs.idx]===q.answer;
    html += '<div class="explain-box '+(isCorrect?"":"wrong")+'"><b>'+(isCorrect?"Correct. ":"Not quite. ")+'</b>'+esc(q.explain)+'</div>';
  }
  html += '<div class="btn-row">';
  if(qs.idx>0) html += '<button class="btn ghost" id="qPrev">&larr; Previous</button>';
  if(answered && qs.idx < total-1) html += '<button class="btn primary" id="qNext">Next &rarr;</button>';
  if(answered && qs.idx === total-1) html += '<button class="btn gold" id="qFinish">See my score</button>';
  html += '</div></div>';
  return html;
}

function renderQuizScore(w, qs){
  var total = w.practice.mcq.length;
  var correct = 0;
  qs.answers.forEach(function(a,i){ if(a===w.practice.mcq[i].answer) correct++; });
  var pct = Math.round(correct/total*100);
  var msg = pct>=80 ? "Excellent work — Masha'Allah!" : pct>=50 ? "Good effort — review and try again." : "Keep practising — revisit the Learn tab first.";
  return '<div class="card score-screen">'+
    ringSVG(pct,150).replace('class="ring"','class="ring score-ring"')+
    '<div class="score-big">'+correct+' / '+total+'</div>'+
    '<p style="margin-top:8px;">'+msg+'</p>'+
    '<div class="btn-row" style="justify-content:center;"><button class="btn primary" id="qRetry">Retry Quiz</button><button class="btn ghost" id="qReview">Review Answers</button></div>'+
    '</div>';
}

function wireQuizEvents(w, qs){
  els('[data-opt]').forEach(function(btn){
    btn.onclick = function(){
      var i = parseInt(btn.getAttribute('data-opt'),10);
      qs.answers[qs.idx] = i;
      renderPracticeTab(w);
    };
  });
  if(el("#qNext")) el("#qNext").onclick = function(){ qs.idx++; renderPracticeTab(w); };
  if(el("#qPrev")) el("#qPrev").onclick = function(){ qs.idx--; renderPracticeTab(w); };
  if(el("#qFinish")) el("#qFinish").onclick = function(){
    qs.finished = true;
    var correct = 0;
    qs.answers.forEach(function(a,i){ if(a===w.practice.mcq[i].answer) correct++; });
    var pct = Math.round(correct/w.practice.mcq.length*100);
    var wp = getWeekProgress(view.cls, w.num);
    var best = (wp.quizBest===null||wp.quizBest===undefined) ? pct : Math.max(wp.quizBest, pct);
    setWeekProgress(view.cls, w.num, { quizBest: best, attempts: (wp.attempts||0)+1 });
    renderPracticeTab(w);
    renderSidebar();
  };
  if(el("#qRetry")) el("#qRetry").onclick = function(){
    qs.idx=0; qs.finished=false; qs.answers = new Array(w.practice.mcq.length).fill(null);
    renderPracticeTab(w);
  };
  if(el("#qReview")) el("#qReview").onclick = function(){
    qs.finished=false; qs.idx=0; renderPracticeTab(w);
  };
}

/* ---------------- Exam Mode ---------------- */
function goExamSetup(){
  view = { screen:"exam", cls:null, week:null, tab:null, exam:null };
  renderAll();
}
function renderExamSetup(){
  var html = '<div class="crumb">Exam Mode</div>';
  html += '<div class="week-head"><h2>WAEC-Style Objective Test</h2></div>';
  html += '<div class="card exam-setup">';
  html += '<p>Choose a class (or all classes combined), then answer a timed set of objective questions, similar to WAEC Paper 1. Timing: 30 seconds per question (10 questions = 5 minutes, 20 questions = 10 minutes).</p>';
  html += '<div class="section-label">CLASS</div><div class="grid cols-2" id="examClassPick">';
  ["all","ss1","ss2","ss3"].forEach(function(c){
    var label = c==="all" ? "All Classes (Mixed)" : DATA[c].label;
    html += '<button class="btn" data-examcls="'+c+'" style="justify-content:center;">'+label+'</button>';
  });
  html += '</div>';
  html += '<div class="section-label">NUMBER OF QUESTIONS</div><div class="grid cols-2" id="examCountPick">';
  [10,20].forEach(function(n){
    var mins = Math.round(n*30/60);
    html += '<button class="btn" data-examcount="'+n+'" style="justify-content:center;">'+n+' Questions ('+mins+' min)</button>';
  });
  html += '</div>';
  html += '<div class="btn-row"><button class="btn gold" id="examStart" disabled>Start Timed Exam</button></div>';
  html += '</div>';
  el("#content").innerHTML = html;

  var chosenCls = null, chosenCount = null;
  els('[data-examcls]').forEach(function(b){
    b.onclick = function(){ els('[data-examcls]').forEach(function(x){x.classList.remove('primary');}); b.classList.add('primary'); chosenCls=b.getAttribute('data-examcls'); tryEnable(); };
  });
  els('[data-examcount]').forEach(function(b){
    b.onclick = function(){ els('[data-examcount]').forEach(function(x){x.classList.remove('primary');}); b.classList.add('primary'); chosenCount=parseInt(b.getAttribute('data-examcount'),10); tryEnable(); };
  });
  function tryEnable(){ el("#examStart").disabled = !(chosenCls && chosenCount); }
  el("#examStart").onclick = function(){ startExam(chosenCls, chosenCount); };
}

function startExam(clsChoice, count){
  var pool = [];
  var keys = clsChoice==="all" ? CLASS_KEYS : [clsChoice];
  keys.forEach(function(c){
    DATA[c].weeks.forEach(function(w){
      if(w.isBreak) return;
      w.practice.mcq.forEach(function(q){ pool.push({cls:c, week:w.num, q:q}); });
    });
  });
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  var picked = pool.slice(0, Math.min(count, pool.length));
  var seconds = picked.length * 30; // 30 seconds per question: 10q=5min, 20q=10min
  view.exam = { items: picked, answers:new Array(picked.length).fill(null), secondsLeft:seconds, timerId:null, finished:false, clsChoice:clsChoice };
  renderExamSession();
}

function renderExamSession(){
  var ex = view.exam;
  var content = el("#content");
  if(ex.finished){ renderExamResult(); return; }

  var html = '<div class="exam-timer"><div>Exam in progress &middot; <span class="mono">'+ex.items.length+'</span> questions</div>'+
    '<div class="t-big mono" id="examClock">'+fmtTime(ex.secondsLeft)+'</div>'+
    '<button class="btn primary" id="examSubmitTop">Submit Exam</button></div>';

  ex.items.forEach(function(item, idx){
    html += '<div class="card exam-q">'+
      '<div class="eq-head"><span>Question '+(idx+1)+' of '+ex.items.length+'</span><span>'+DATA[item.cls].label+' &middot; Wk '+item.week+'</span></div>'+
      '<div class="q-text" style="font-size:1rem;">'+esc(item.q.q)+'</div>'+
      '<div class="opt-list">'+
      item.q.options.map(function(o,i){
        var sel = ex.answers[idx]===i ? "selected" : "";
        return '<button class="opt '+sel+'" data-exam-opt="'+idx+':'+i+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
      }).join("")+
      '</div></div>';
  });

  var answeredCount = ex.answers.filter(function(a){ return a!==null; }).length;
  html += '<div class="card" style="text-align:center; padding:26px;">'+
    '<p style="margin-bottom:14px;">You have answered '+answeredCount+' of '+ex.items.length+' questions.</p>'+
    '<button class="btn gold" id="examSubmitBottom" style="font-size:1rem; padding:14px 32px;">Submit Exam</button>'+
    '</div>';

  content.innerHTML = html;
  els('[data-exam-opt]').forEach(function(btn){
    btn.onclick = function(){
      var parts = btn.getAttribute('data-exam-opt').split(':');
      ex.answers[parseInt(parts[0],10)] = parseInt(parts[1],10);
      renderExamSession();
    };
  });
  el("#examSubmitTop").onclick = function(){ finishExam(); };
  el("#examSubmitBottom").onclick = function(){ finishExam(); };

  if(ex.timerId) clearInterval(ex.timerId);
  ex.timerId = setInterval(function(){
    ex.secondsLeft--;
    var clock = el("#examClock");
    if(clock) clock.textContent = fmtTime(ex.secondsLeft);
    if(ex.secondsLeft<=0){ clearInterval(ex.timerId); finishExam(); }
  }, 1000);
}
function fmtTime(s){
  if(s<0) s=0;
  var m = Math.floor(s/60), sec = s%60;
  return (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
}
function finishExam(){
  var ex = view.exam;
  if(ex.timerId) clearInterval(ex.timerId);
  ex.finished = true;
  var correct = 0;
  ex.items.forEach(function(item, idx){ if(ex.answers[idx]===item.q.answer) correct++; });
  var pct = Math.round(correct/ex.items.length*100);
  S.examHistory.push({ timestamp: Date.now(), clsChoice: ex.clsChoice, total: ex.items.length, correct: correct, pct: pct });
  saveState();
  renderExamResult();
}
function renderExamResult(){
  var ex = view.exam;
  var correct = 0;
  ex.items.forEach(function(item, idx){ if(ex.answers[idx]===item.q.answer) correct++; });
  var pct = Math.round(correct/ex.items.length*100);
  var html = '<div class="crumb">Exam Mode / Result</div>';
  html += '<div class="card score-screen">'+
    ringSVG(pct,150).replace('class="ring"','class="ring score-ring"')+
    '<div class="score-big">'+correct+' / '+ex.items.length+'</div>'+
    '<p>Score: '+pct+'%</p>'+
    '<div class="btn-row" style="justify-content:center;"><button class="btn primary" id="examReview">Review Answers</button><button class="btn ghost" id="examAgain">New Exam</button></div>'+
    '</div>';

  html += '<div class="section-label" id="reviewLabel" style="display:none;">REVIEW</div>';
  html += '<div id="reviewList" style="display:none;">';
  ex.items.forEach(function(item, idx){
    var correctAns = item.q.answer;
    var userAns = ex.answers[idx];
    html += '<div class="card exam-q">'+
      '<div class="eq-head"><span>Question '+(idx+1)+'</span><span>'+DATA[item.cls].label+' &middot; Wk '+item.week+'</span></div>'+
      '<div class="q-text" style="font-size:1rem;">'+esc(item.q.q)+'</div><div class="opt-list">'+
      item.q.options.map(function(o,i){
        var cls="opt";
        if(i===correctAns) cls+=" correct-answer";
        else if(i===userAns) cls+=" wrong-answer";
        return '<div class="'+cls+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></div>';
      }).join("")+'</div>'+
      '<div class="explain-box">'+esc(item.q.explain)+'</div>'+
      '</div>';
  });
  html += '</div>';

  el("#content").innerHTML = html;
  el("#examReview").onclick = function(){
    el("#reviewLabel").style.display="block"; el("#reviewList").style.display="block";
    el("#examReview").style.display="none";
  };
  el("#examAgain").onclick = goExamSetup;
}

/* ---------------- Export / Admin ---------------- */
function exportResults(){
  var payload = {
    studentName: S.name || "Unnamed Student",
    exportedAt: Date.now(),
    progress: S.progress,
    examHistory: S.examHistory,
    comments: S.comments
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var safeName = (S.name||"student").replace(/[^a-z0-9]/gi,'_').toLowerCase();
  a.download = "hybraheeem-results-"+safeName+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function goAdmin(){
  var pass = prompt("Enter admin passcode to view results and comments:");
  if(pass === null) return;
  if(pass !== "hybraheeem2026"){ alert("Incorrect passcode."); return; }
  view = { screen:"admin", cls:null, week:null, tab:null, exam:null };
  renderAll();
}

function renderAdmin(){

      '<th style="padding:8px;">Comments</th><th style="padding:8px;">Imported</th></tr></thead><tbody>';
    A.records.forEach(function(rec, idx){
      var d = rec.data;
      var counts = {ss1:0, ss2:0, ss3:0};
      var quizScores = [];
      Object.keys(d.progress||{}).forEach(function(k){
        var p = d.progress[k];
        var cls = k.split('-')[0];
