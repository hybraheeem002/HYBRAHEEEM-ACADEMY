          if(counts[cls] !== undefined) counts[cls]++;
          quizScores.push(p.quizBest);
        }
      });
      var avgQuiz = quizScores.length ? Math.round(quizScores.reduce(function(a,b){return a+b;},0)/quizScores.length) : 0;

        '<td style="padding:8px;">'+counts.ss2+' / 10</td>'+
        '<td style="padding:8px;">'+counts.ss3+' / 6</td>'+
        '<td style="padding:8px;">'+avgQuiz+'%</td>'+
        '<td style="padding:8px;">'+exams.length+'</td>'+
        '<td style="padding:8px;">'+bestExam+'%</td>'+
        '<td style="padding:8px;">'+(comments.length ? '<button class="btn ghost" data-viewcomments="'+idx+'" style="padding:4px 10px; font-size:.76rem;">'+comments.length+' &#9998;</button>' : '0')+'</td>'+

    A3.records.forEach(function(rec){
      var d = rec.data;
      var counts = {ss1:0, ss2:0, ss3:0};

      var bestExam = exams.length ? Math.max.apply(null, exams.map(function(e){return e.pct;})) : 0;

    var csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download="hybraheeem-class-report.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  };
  els('[data-viewcomments]').forEach(function(btn){
    btn.onclick = function(){
      var idx = parseInt(btn.getAttribute('data-viewcomments'),10);
      var rec = A.records[idx];
      var html2 = '<div class="card"><h4>Comments from '+esc(rec.data.studentName)+'</h4>';
      (rec.data.comments||[]).forEach(function(c){
        html2 += '<div style="padding:10px 0; border-bottom:1px dashed var(--border);"><div style="font-size:.76rem; color:var(--text-soft);">'+fmtDate(c.timestamp)+' &middot; '+esc(c.context||"")+'</div><div>'+esc(c.message)+'</div></div>';
      });
      html2 += '</div>';
      el("#commentsPane").innerHTML = html2;
    };
  });
}

/* ---------------- Name modal ---------------- */
function openNameModal(forceShow){
  var modal = el("#nameModal");
  modal.classList.remove('hidden');
  el("#nameInput").value = S.name || "";
  el("#nameInput").focus();
}
function closeNameModal(){ el("#nameModal").classList.add('hidden'); }
el("#nameSubmit").onclick = submitName;
el("#nameInput").addEventListener('keydown', function(e){ if(e.key==="Enter") submitName(); });
function submitName(){
  var v = el("#nameInput").value.trim();
  if(v) S.name = v;
  saveState();
  closeNameModal();
  renderTopNav();
}
el("#brandBtn").onclick = goHome;

/* ---------------- Theme & font controls ---------------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.theme);
  el("#themeToggle").innerHTML = S.theme==="dark" ? "&#9728;" : "&#9789;";
}
el("#themeToggle").onclick = function(){
  S.theme = S.theme==="dark" ? "light" : "dark";
  saveState(); applyTheme();
};
function applyFontScale(){
  document.body.style.setProperty('--fscale', S.fscale);
}
el("#fontUp").onclick = function(){ S.fscale = Math.min(1.3, +(S.fscale+0.1).toFixed(2)); saveState(); applyFontScale(); };
el("#fontDown").onclick = function(){ S.fscale = Math.max(0.85, +(S.fscale-0.1).toFixed(2)); saveState(); applyFontScale(); };

/* ---------------- Footer ---------------- */
function wireFooter(){
  var footer = el(".footer-note");
  footer.innerHTML = 'Hybraheeem Academy &middot; Islamic Studies Learning Platform &middot; Built for SS1&ndash;SS3 First Term, aligned with the WAEC syllabus &amp; school scheme of work.'+
    '<div style="margin-top:10px;"><button class="btn ghost" id="exportBtn" style="padding:6px 14px; font-size:.76rem;">Export My Results</button> '+
    '<button class="btn ghost" id="adminBtn" style="padding:6px 14px; font-size:.76rem;">Admin Dashboard</button></div>';
  el("#exportBtn").onclick = exportResults;
  el("#adminBtn").onclick = goAdmin;
}

/* ---------------- Master render ---------------- */
function renderAll(){
  renderTopNav();
  renderSidebar();
  if(view.screen==="home") renderHome();
  else if(view.screen==="week") renderWeek();
  else if(view.screen==="admin") renderAdmin();
  else if(view.screen==="exam"){
    if(view.exam) renderExamSession(); else renderExamSetup();
  }
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---------------- Init ---------------- */
applyTheme();
applyFontScale();
wireFooter();
if(!S.name){ openNameModal(); } else { closeNameModal(); }
renderAll();

})();

</script>
</body>
</html>
