<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybraheeem Academy — Islamic Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#1F6F5C; --emerald-deep:#123D33; --emerald-pale:#E4EFE9;
  --gold:#C6961F; --gold-light:#E6C568; --gold-dim:#8a6d2c;
  --sand:#EFE6D0; --paper:#FBF8F1;
  --ink:#16302B; --ink-soft:#3B534C;
  --line: rgba(22,48,43,0.14);
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow: 0 6px 24px rgba(18,61,51,0.10);
  --danger:#A23B2E; --ok:#1F6F5C;
  --bg:var(--paper); --surface:#ffffff; --surface-2:var(--sand);
  --text:var(--ink); --text-soft:var(--ink-soft); --border:var(--line);
  --accent:var(--emerald); --accent-2:var(--gold);
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0E1F1B; --surface:#153029; --surface-2:#1B3A31;
    --text:#EFEAD9; --text-soft:#B9CFC6; --border: rgba(239,234,217,0.14);
    --emerald-pale:#1B3A31; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1F1B; --surface:#153029; --surface-2:#1B3A31;
  --text:#EFEAD9; --text-soft:#B9CFC6; --border: rgba(239,234,217,0.14);
  --emerald-pale:#1B3A31; color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top: env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size: calc(16px * var(--fscale, 1));
  -webkit-font-smoothing:antialiased;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  transition: background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:'Amiri',serif; margin:0 0 .4em; font-weight:700; color:var(--text);}
p{margin:0 0 .8em; line-height:1.6;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
.mono{font-variant-numeric: tabular-nums;}

/* decorative star motif (used sparingly) */
.star-motif{position:absolute; opacity:.07; pointer-events:none;}
.pattern-strip{
  height:10px; width:100%;
  background-image: repeating-linear-gradient(135deg, var(--gold) 0 2px, transparent 2px 14px);
  opacity:.5;
}

/* ---------- App shell ---------- */
#app{min-height:100%; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:40;
  padding-top: env(safe-area-inset-top,0px);
  background:var(--surface); border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1240px; margin:0 auto; padding:12px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; cursor:pointer;}
.brand svg{width:34px; height:34px; flex:none;}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text b{font-family:'Amiri',serif; font-size:1.05rem; letter-spacing:.01em;}
.brand-text span{font-size:.68rem; color:var(--text-soft); letter-spacing:.04em;}
.navtabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:999px;}
.navtabs button{
  border:none; background:transparent; padding:8px 14px; border-radius:999px;
  font-size:.86rem; font-weight:600; color:var(--text-soft);
}
.navtabs button.active{background:var(--emerald); color:#fff;}
.topbar-tools{display:flex; align-items:center; gap:8px;}
.tool-btn{
  width:34px; height:34px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:.85rem; font-weight:700;
}
.tool-btn:hover{border-color:var(--emerald);}
.name-chip{
  display:flex; align-items:center; gap:6px; padding:5px 12px 5px 6px; border-radius:999px;
  background:var(--emerald-pale); font-size:.82rem; font-weight:600; border:1px solid var(--border);
}
.name-chip .dot{width:22px;height:22px;border-radius:50%; background:var(--gold); color:#3a2c05; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:800;}

/* ---------- Layout ---------- */
#layout{max-width:1240px; margin:0 auto; width:100%; flex:1; display:flex; gap:0; align-items:flex-start;}
#sidebar{
  width:290px; flex:none; padding:20px 12px 40px; position:sticky; top:64px;
  max-height: calc(100vh - 64px); overflow-y:auto;
}
#sidebar.hidden{display:none;}
.sb-head{padding:6px 10px 10px; display:flex; align-items:center; justify-content:space-between;}
.sb-head h3{font-size:1rem; margin:0;}
.sb-progress-track{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin:6px 10px 14px;}
.sb-progress-fill{height:100%; background:linear-gradient(90deg,var(--emerald),var(--gold)); border-radius:4px;}
.week-item{
  display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:var(--radius-s);
  margin-bottom:2px; border:1px solid transparent;
}
.week-item:hover{background:var(--surface-2);}
.week-item.active{background:var(--emerald-pale); border-color:var(--emerald);}
.week-item.break{opacity:.62;}
.wk-num{width:26px; height:26px; border-radius:50%; background:var(--surface-2); color:var(--text-soft);
  display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; flex:none;}
.week-item.active .wk-num{background:var(--emerald); color:#fff;}
.wk-title{font-size:.82rem; line-height:1.25; flex:1;}
.wk-status{width:9px; height:9px; border-radius:50%; flex:none;}
.wk-status.done{background:var(--gold);}
.wk-status.progress{background:var(--emerald); opacity:.55;}
.wk-status.todo{background:var(--border);}

#content{flex:1; min-width:0; padding:26px 24px 80px;}
@media (max-width: 880px){
  #layout{flex-direction:column;}
  #sidebar{position:relative; top:0; width:100%; max-height:none; padding:14px 4px;}
  #content{padding:18px 4px 70px;}
  .topbar-inner{padding:10px 14px;}
  .navtabs{order:3; width:100%; justify-content:space-between;}
}

/* ---------- Home ---------- */
.hero{
  position:relative; overflow:hidden; border-radius:var(--radius-l);
  background:linear-gradient(135deg,var(--emerald-deep),var(--emerald));
  color:#F6F1DE; padding:46px 34px; margin-bottom:26px;
}
.hero h1{color:#fff; font-size:clamp(1.7rem,4vw,2.5rem); margin-bottom:.25em;}
.hero p{color:#DDEAE3; max-width:520px; font-size:1rem;}
.hero .sub{font-size:.86rem; letter-spacing:.03em; color:var(--gold-light); font-weight:700; margin-bottom:10px;}
.hero-star{position:absolute; right:-40px; top:-40px; width:260px; height:260px; opacity:.14;}

.grid{display:grid; gap:16px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:760px){ .grid.cols-3, .grid.cols-2{grid-template-columns:1fr;} }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:20px; box-shadow: var(--shadow);
}
.section-label{
  font-size:.78rem; font-weight:700; color:var(--gold-dim); margin:30px 0 12px; letter-spacing:.02em;
}
:root[data-theme="dark"] .section-label{color:var(--gold-light);}

.continue-card{
  display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:var(--radius-m);
  background:var(--surface-2); border:1px solid var(--border); margin-bottom:8px;
}
.continue-card .cc-icon{
  width:44px;height:44px;border-radius:12px;background:var(--gold); color:#3a2c05;
  display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex:none;
}
.continue-card .cc-text small{display:block; color:var(--text-soft); font-size:.76rem; margin-bottom:2px;}
.continue-card button{margin-left:auto;}

.class-card{cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.class-card:hover{transform:translateY(-2px); border-color:var(--emerald);}
.class-card h3{font-size:1.3rem; margin-bottom:2px;}
.class-card .cc-full{color:var(--text-soft); font-size:.8rem; margin-bottom:14px;}
.ring-wrap{display:flex; align-items:center; gap:14px;}
.ring{width:58px;height:58px; flex:none;}
.ring-label{font-size:.8rem; color:var(--text-soft);}
.ring-label b{display:block; font-size:1rem; color:var(--text); font-family:'Amiri',serif;}

.qotd{background:linear-gradient(135deg,var(--surface-2),var(--surface)); }
.qotd h4{font-size:.95rem; margin-bottom:10px;}
.qotd .q-options{display:flex; flex-direction:column; gap:6px; margin:10px 0;}
.qotd-opt{padding:8px 12px; border-radius:var(--radius-s); border:1px solid var(--border); font-size:.85rem; background:var(--surface);}
.qotd-opt.correct{border-color:var(--emerald); background:var(--emerald-pale);}
.qotd-opt.wrong{border-color:var(--danger); opacity:.7;}

.exam-card{background:linear-gradient(135deg,#2b1f0f,#4a350f); color:#F6EAD0;}
:root:not([data-theme="dark"]) .exam-card{background:linear-gradient(135deg,var(--gold-dim),var(--gold));}
.exam-card h3{color:#fff;}
.exam-card p{color:rgba(255,255,255,.85);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; font-size:.86rem;
}
.btn.primary{background:var(--emerald); color:#fff; border-color:var(--emerald);}
.btn.gold{background:var(--gold); color:#3a2c05; border-color:var(--gold);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

/* ---------- Breadcrumb / Week header ---------- */
.crumb{font-size:.8rem; color:var(--text-soft); margin-bottom:6px;}
.week-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.week-head h2{font-size:1.5rem; max-width:640px;}
.cat-pill{display:inline-block; font-size:.7rem; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--gold-light); color:#3a2c05; margin-bottom:8px;}

.tabbar{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; width:max-content; margin-bottom:22px;}
.tabbar button{border:none; background:transparent; padding:9px 20px; border-radius:999px; font-weight:700; font-size:.86rem; color:var(--text-soft);}
.tabbar button.active{background:var(--surface); color:var(--emerald); box-shadow:0 1px 4px rgba(0,0,0,.08);}

/* ---------- Learn content ---------- */
.learn-intro{font-size:1.02rem; color:var(--text-soft); border-left:3px solid var(--gold); padding-left:14px; margin-bottom:24px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h4{font-size:1.05rem; display:flex; align-items:center; gap:8px;}
.lesson-section h4::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--emerald); display:inline-block;}
.lesson-section ul{margin:0; padding-left:20px;}
.lesson-section li{margin-bottom:8px; line-height:1.55;}
.terms-box{
  background:var(--surface-2); border-radius:var(--radius-m); padding:18px 20px; margin:24px 0;
  border:1px solid var(--border);
}
.terms-box h4{font-size:.85rem; text-transform:none; letter-spacing:.02em; color:var(--gold-dim); margin-bottom:10px;}
:root[data-theme="dark"] .terms-box h4{color:var(--gold-light);}
.term-row{display:flex; gap:14px; padding:8px 0; border-bottom:1px dashed var(--border);}
.term-row:last-child{border-bottom:none;}
.term-ar{font-family:'Amiri',serif; font-size:1.3rem; min-width:110px;}
.term-en{color:var(--text-soft); font-size:.88rem; align-self:center;}
.refs-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
.ref-chip{font-size:.74rem; background:var(--emerald-pale); color:var(--emerald); padding:4px 10px; border-radius:999px; font-weight:700;}

.break-card{
  text-align:center; padding:60px 20px; border-radius:var(--radius-l); background:var(--surface-2);
  border:1px dashed var(--border);
}
.break-card .bicon{font-size:2.4rem; margin-bottom:10px;}

/* ---------- Quiz ---------- */
.quiz-progress{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
.qp-dot{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; background:var(--surface-2); color:var(--text-soft); border:1px solid var(--border);}
.qp-dot.current{border-color:var(--emerald); color:var(--emerald);}
.qp-dot.correct{background:var(--emerald); color:#fff; border-color:var(--emerald);}
.qp-dot.wrong{background:var(--danger); color:#fff; border-color:var(--danger);}

.q-card{padding:24px;}
.q-card .q-text{font-size:1.1rem; font-family:'Amiri',serif; margin-bottom:18px;}
.opt-list{display:flex; flex-direction:column; gap:10px;}
.opt{
  text-align:left; padding:12px 16px; border-radius:var(--radius-m); border:1.5px solid var(--border);
  background:var(--surface); font-size:.92rem; display:flex; gap:10px; align-items:flex-start;
}
.opt .opt-letter{width:22px;height:22px;border-radius:50%;background:var(--surface-2); flex:none; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700;}
.opt:hover:not(:disabled){border-color:var(--emerald);}
.opt.selected{border-color:var(--emerald); background:var(--emerald-pale);}
.opt.correct-answer{border-color:var(--ok); background:var(--emerald-pale);}
.opt.wrong-answer{border-color:var(--danger); background:rgba(162,59,46,0.08);}
.explain-box{margin-top:16px; padding:14px 16px; border-radius:var(--radius-s); background:var(--surface-2); font-size:.88rem; border-left:3px solid var(--emerald);}
.explain-box.wrong{border-left-color:var(--danger);}

.score-screen{text-align:center; padding:40px 20px;}
.score-ring{width:150px; margin:0 auto 18px;}
.score-big{font-family:'Amiri',serif; font-size:2.4rem;}

.theory-card{margin-top:10px;}
.theory-card textarea{
  width:100%; min-height:110px; border-radius:var(--radius-s); border:1px solid var(--border);
  padding:12px; font-family:inherit; font-size:.9rem; background:var(--surface); color:var(--text); resize:vertical;
}
.model-answer{margin-top:12px; padding:14px 16px; border-radius:var(--radius-s); background:var(--surface-2); font-size:.88rem; display:none;}
.model-answer.shown{display:block;}

/* ---------- Exam mode ---------- */
.exam-setup .grid.cols-2{margin:18px 0;}
.exam-timer{
  position:sticky; top:64px; z-index:20; display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 18px; margin-bottom:20px;
}
.exam-timer .t-big{font-family:'Amiri',serif; font-size:1.4rem;}
.exam-q{padding:20px; margin-bottom:14px;}
.exam-q .eq-head{display:flex; justify-content:space-between; font-size:.78rem; color:var(--text-soft); margin-bottom:6px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(14,31,27,.6); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal-overlay.hidden{display:none;}
.modal{
  background:var(--surface); border-radius:var(--radius-l); padding:32px; max-width:420px; width:100%;
  text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal svg{width:64px;height:64px; margin-bottom:12px;}
.modal input{
  width:100%; padding:12px 14px; border-radius:var(--radius-s); border:1px solid var(--border);
  font-size:1rem; text-align:center; margin:16px 0; background:var(--bg); color:var(--text);
}
.footer-note{text-align:center; color:var(--text-soft); font-size:.76rem; padding:30px 20px; }
::selection{background:var(--gold-light);}
.visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brandBtn">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="32,4 39,25 61,25 43,38 50,60 32,47 14,60 21,38 3,25 25,25"
            fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="32" cy="32" r="9" fill="var(--emerald)"/>
        </svg>
        <div class="brand-text">
          <b>Hybraheeem Academy</b>
          <span>ISLAMIC STUDIES · SS1&ndash;SS3</span>
        </div>
      </div>
      <div class="navtabs" id="navTabs"></div>
      <div class="topbar-tools">
        <button class="tool-btn" id="fontDown" title="Smaller text" aria-label="Smaller text">A-</button>
        <button class="tool-btn" id="fontUp" title="Larger text" aria-label="Larger text">A+</button>
        <button class="tool-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">&#9789;</button>
        <div class="name-chip" id="nameChip"></div>
      </div>
    </div>
  </header>
  <div id="layout">
    <nav id="sidebar" class="hidden"></nav>
    <main id="content"></main>
  </div>
  <div class="footer-note">Hybraheeem Academy &middot; Islamic Studies Learning Platform &middot; Built for SS1&ndash;SS3 First Term, aligned with the WAEC syllabus &amp; school scheme of work.</div>
</div>

<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="32,4 39,25 61,25 43,38 50,60 32,47 14,60 21,38 3,25 25,25" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="9" fill="var(--emerald)"/>
    </svg>
    <h2>Assalamu Alaikum!</h2>
    <p>Welcome to Hybraheeem Academy's Islamic Studies platform. What's your name?</p>
    <input type="text" id="nameInput" placeholder="Enter your first name" maxlength="24" autocomplete="off">
    <button class="btn primary" id="nameSubmit" style="width:100%; justify-content:center;">Start Learning</button>
  </div>
</div>

<script id="content-data" type="application/json">{"ss1": {"label": "SS1", "full": "Senior Secondary School 1", "weeks": [{"num": 1, "title": "Revelation of the Holy Qur'an", "category": "Qur'an", "isBreak": false, "breakNote": "", "learn": {"intro": "How Allah's final revelation began to reach humanity through Prophet Muhammad ﷺ.", "sections": [{"heading": "The Mode of Revelation", "points": ["The Qur'an was not revealed all at once — it came down gradually (piecemeal) over about 23 years, guiding the early Muslim community step by step.", "Allah describes three ways He communicates with His messengers in Q42:51 — by direct inspiration (wahy), from behind a veil, or by sending an angel messenger.", "For the Qur'an, revelation came mainly through the angel Jibril (Gabriel), who brought the exact words to the Prophet ﷺ."]}, {"heading": "The Prophet's Visits to Cave Hira", "points": ["Before Prophethood, Muhammad ﷺ used to retreat to Cave Hira on the Mountain of Light (Jabal an-Nur) near Makkah to reflect in solitude.", "At the age of 40, Angel Jibril appeared to him there and commanded, 'Iqra' (Read/Recite) — the first words of Suratul-'Alaq (Q96:1-5) were revealed.", "The Prophet ﷺ was frightened by the experience and returned home trembling, saying to Khadijah, 'Cover me, cover me!'"]}, {"heading": "Khadijah's Role", "points": ["Khadijah (R.A.) comforted him and reassured him that Allah would never disgrace him, reminding him of his kindness, honesty and good character.", "She took him to her cousin Waraqah ibn Nawfal, a learned man familiar with earlier scriptures, who confirmed that this was the same angel sent to Musa (Moses) and that Muhammad ﷺ was indeed a Prophet.", "Khadijah became the very first person to believe in his message — the first Muslim."]}, {"heading": "Why Piecemeal Revelation?", "points": ["It made the Qur'an easier to memorise and understand, since the Prophet's companions could not read or write in large numbers.", "It allowed laws and guidance to respond to real events and questions as they arose in the community.", "It strengthened and comforted the Prophet's heart gradually, helping him face years of hardship and opposition (Q25:32)."]}, {"heading": "Deeper Insight: Why This Matters", "points": ["WAEC often asks candidates to distinguish the three modes of revelation in Q42:51 — know them as: direct inspiration (ilham), speaking from behind a veil (as with Musa at the burning bush), and sending an angel messenger (as with Jibril and the Prophet ﷺ).", "The Prophet ﷺ received revelation for 13 years in Makkah and 10 years in Madinah — a useful figure to remember when answering questions on the timeline of revelation.", "Compare this with earlier scriptures, which Muslims believe were revealed in more complete portions — piecemeal revelation is often cited as a distinguishing feature of the Qur'an's method of transmission."]}], "terms": [{"ar": "وَحْي", "en": "Wahy — divine revelation/inspiration"}, {"ar": "اِقْرَأ", "en": "Iqra — 'Read' or 'Recite', the first word revealed"}, {"ar": "ورقة بن نوفل", "en": "Waraqah ibn Nawfal — Khadijah's cousin who confirmed the Prophet's mission"}], "refs": [{"label": "Q96:1-5", "url": "https://quran.com/96/1-5", "title": "Q96:1-5 (Suratul-'Alaq)"}, {"label": "Q42:51", "url": "https://quran.com/42/51", "title": null}, {"label": "Q37:102", "url": "https://quran.com/37/102", "title": null}, {"label": "Q27:28", "url": "https://quran.com/27/28", "title": null}, {"label": "Q2:87", "url": "https://quran.com/2/87", "title": null}]}, "practice": {"mcq": [{"q": "In which cave did Prophet Muhammad ﷺ receive the first revelation?", "options": ["Cave Hira", "Cave Badr", "Cave Thawr", "Cave Uhud"], "answer": 0, "explain": "The first revelation came in Cave Hira, on Jabal an-Nur (Mountain of Light) near Makkah."}, {"q": "The first verses revealed to the Prophet ﷺ were the opening of which Surah?", "options": ["Suratul-'Alaq", "Suratul-Baqarah", "Suratul-Ikhlas", "Suratul-Fatihah"], "answer": 0, "explain": "Q96:1-5, the beginning of Suratul-'Alaq, was the first revelation, beginning with the command 'Iqra' (Read)."}, {"q": "Who first confirmed to the Prophet ﷺ that he had truly become a Messenger of Allah?", "options": ["Bilal ibn Rabah", "Waraqah ibn Nawfal", "'Umar ibn al-Khattab", "Abu Bakr"], "answer": 1, "explain": "Waraqah ibn Nawfal, Khadijah's learned cousin, recognised the angel's description and confirmed the Prophet's mission."}, {"q": "Why was the Qur'an revealed piecemeal rather than all at once?", "options": ["To make it easier to memorise, apply gradually, and strengthen the Prophet's heart", "Because Allah forgot some verses", "Because the Prophet ﷺ requested it in bits", "It has no particular reason"], "answer": 0, "explain": "Gradual revelation eased memorisation, allowed laws to respond to real situations, and comforted the Prophet ﷺ (Q25:32)."}], "theory": [{"q": "Explain the mode of revelation of the Holy Qur'an and discuss the significance of its piecemeal revelation.", "answer": "A full answer should: (1) describe the three modes of divine communication in Q42:51; (2) narrate the events at Cave Hira — the first revelation and the Prophet's reaction; (3) mention Khadijah's supportive role and Waraqah's confirmation; (4) explain at least three benefits of gradual revelation (ease of memorisation, gradual legislation, emotional support for the Prophet ﷺ)."}]}}, {"num": 2, "title": "Content, Preservation, Compilation & Standardization of the Qur'an", "category": "Qur'an", "isBreak": false, "breakNote": "", "learn": {"intro": "How the Qur'an, first memorised and recited, became the single written Mushaf Muslims read today.", "sections": [{"heading": "Makkan and Madinan Suwar", "points": ["Chapters (Suwar) revealed before the Hijrah are called Makkan — generally shorter, dealing with Tawhid, the Hereafter and moral character.", "Chapters revealed after the Hijrah are called Madinan — generally longer, dealing with law, social relations and community affairs.", "The Qur'an contains 114 Suwar in total, arranged not in the order they were revealed but as guided by the Prophet ﷺ."]}, {"heading": "Preservation During the Prophet's Lifetime", "points": ["Companions memorised the Qur'an by heart as it was revealed — these memorisers were called Huffaz.", "It was also written down on whatever materials were available: palm leaves, flat stones, bones, and pieces of leather or parchment.", "The Prophet ﷺ regularly revised the whole Qur'an with Angel Jibril, especially in Ramadan, ensuring accuracy."]}, {"heading": "Compilation Under Abu Bakr", "points": ["After many Huffaz were martyred in the Battle of Yamamah, 'Umar advised Caliph Abu Bakr to gather the Qur'an into one book for fear it might be lost.", "Zayd ibn Thabit, the Prophet's chief scribe, was assigned to collect the verses from written material and the memory of reliable companions.", "The resulting single copy (Suhuf) was kept with Abu Bakr, then 'Umar, then Hafsah (the Prophet's wife)."]}, {"heading": "Standardization Under 'Uthman", "points": ["As Islam spread, differences in dialects of recitation began to cause disputes among Muslims in different regions.", "Caliph 'Uthman ibn 'Affan ordered Zayd ibn Thabit's committee to produce standard copies (Mushaf) based on the Quraysh dialect.", "Copies were sent to major cities, and other variant manuscripts were retired — giving the Ummah the single standardised text used worldwide today."]}, {"heading": "Deeper Insight: The Human Effort Behind the Mushaf", "points": ["Zayd ibn Thabit's qualifications for the task were notable: he had memorised the Qur'an, was present at the Prophet's final revision with Jibril, and was known for precision — WAEC essay questions often ask candidates to justify why he was chosen.", "'Uthman's committee cross-checked every verse against at least two independent sources — a written copy and a reliable memoriser — before accepting it into the standard Mushaf.", "The 'Uthmanic copies sent to Makkah, Syria, Kufah, Basrah and Madinah are the direct ancestors of every printed Qur'an in the world today, which is why Muslims regard the text as unbroken and authentic from the Prophet's time."]}], "terms": [{"ar": "صُحُف", "en": "Suhuf — the loose, unbound compiled sheets (under Abu Bakr)"}, {"ar": "مُصْحَف", "en": "Mushaf — the standardised bound copy of the Qur'an (under 'Uthman)"}, {"ar": "حُفَّاظ", "en": "Huffaz — those who memorise the Qur'an by heart"}], "refs": [{"label": "Historical account — no single verse reference", "url": null, "title": null}]}, "practice": {"mcq": [{"q": "Suwar revealed before the Hijrah are classified as:", "options": ["Qudsi", "Meccan-Madinan", "Madinan", "Makkan"], "answer": 3, "explain": "Chapters revealed before the migration to Madinah are called Makkan Suwar."}, {"q": "Who was assigned to compile the Qur'an into one book under Abu Bakr?", "options": ["Abu Hurayrah", "Zayd ibn Thabit", "Salman al-Farisi", "Bilal ibn Rabah"], "answer": 1, "explain": "Zayd ibn Thabit, the Prophet's trusted scribe, led the compilation effort."}, {"q": "What event prompted the compilation of the Qur'an under Abu Bakr?", "options": ["The Conquest of Makkah", "The Treaty of Hudaybiyyah", "Heavy loss of Huffaz at the Battle of Yamamah", "The Farewell Pilgrimage"], "answer": 2, "explain": "Many memorisers of the Qur'an were martyred at Yamamah, prompting fear that portions could be lost."}, {"q": "The standardised copies of the Qur'an produced under 'Uthman are called:", "options": ["Tafsir", "Ayat", "Mushaf", "Suhuf"], "answer": 2, "explain": "The bound, standardised copies distributed by 'Uthman's committee are called Mushaf."}], "theory": [{"q": "Trace the stages of preservation of the Qur'an from the time of the Prophet ﷺ to the Caliphate of 'Uthman.", "answer": "A good answer covers: memorisation and writing during the Prophet's lifetime; the compilation under Abu Bakr (cause, method, custodian); and the standardisation under 'Uthman (cause — dialectal disputes, the committee, distribution of copies)."}]}}, {"num": 3, "title": "Hadith & Sunnah: Meaning, Components and Classification", "category": "Hadith", "isBreak": false, "breakNote": "", "learn": {"intro": "The second major source of Islamic guidance after the Qur'an.", "sections": [{"heading": "Hadith and Sunnah", "points": ["Hadith refers to the reported sayings, actions or approvals of Prophet Muhammad ﷺ.", "Sunnah refers more broadly to his entire way of life — his practice, conduct and example — which may be conveyed through Hadith.", "The two overlap closely: Hadith is the record; Sunnah is the practice the record describes."]}, {"heading": "Hadith Nabawi and Hadith Qudsi", "points": ["Hadith Nabawi: the Prophet's own words, in his own wording, inspired by Allah but not part of the Qur'an.", "Hadith Qudsi: the meaning is from Allah, but the Prophet ﷺ expressed it in his own words — distinct from both the Qur'an (whose exact wording is divine) and ordinary Hadith."]}, {"heading": "Components of a Hadith", "points": ["Isnad — the chain of narrators through whom the report has been transmitted back to the Prophet ﷺ.", "Matn — the actual text/content of the report.", "Rawi — each individual narrator in the chain."]}, {"heading": "Classification of Hadith", "points": ["Sahih (authentic) — narrated by a continuous, trustworthy chain of narrators with no hidden defect or contradiction.", "Hasan (good) — reliable but with a narrator of slightly weaker memory than in Sahih.", "Da'if (weak) — has a break in the chain or a narrator known to be unreliable.", "Scholars check the criteria of authenticity: the trustworthiness and precision of every narrator, and an unbroken chain back to the Prophet ﷺ."]}, {"heading": "Deeper Insight: Applying the Classification", "points": ["A Sahih Hadith must meet five conditions: a continuous chain, trustworthy narrators, precise memory in each narrator, no hidden defect ('illah), and no contradiction with a more reliable narration (shudhudh).", "Da'if Hadith are not automatically rejected outright by all scholars — some permit citing them for moral encouragement (targhib/tarhib), but never to establish a ruling of Halal or Haram.", "Exam tip: when asked to 'state the components of a Hadith', always give all three — Isnad, Matn and Rawi — with a one-line definition of each, as partial answers lose marks in WAEC Paper 2."]}], "terms": [{"ar": "إسناد", "en": "Isnad — chain of narration"}, {"ar": "متن", "en": "Matn — the text/content of a Hadith"}, {"ar": "راوي", "en": "Rawi — a narrator"}, {"ar": "صحيح / حسن / ضعيف", "en": "Sahih / Hasan / Da'if — authentic / good / weak"}], "refs": [{"label": "Sihahus-Sittah (the Six Sound Books)", "url": "https://sunnah.com/", "title": null}]}, "practice": {"mcq": [{"q": "What is the difference between Hadith and Sunnah?", "options": ["Hadith is the recorded report; Sunnah is the Prophet's practice/way of life", "Sunnah is only about worship, Hadith is about everything", "Hadith came before Sunnah historically", "They mean exactly the same with no difference"], "answer": 0, "explain": "Hadith is the transmitted report; Sunnah is the broader practice and example those reports describe."}, {"q": "A Hadith Qudsi differs from the Qur'an because:", "options": ["It has no chain of narration", "It was written by companions only", "Its meaning is from Allah but its wording is the Prophet's own", "It is found only in Suratul-Fatihah"], "answer": 2, "explain": "In Hadith Qudsi, the meaning is divinely inspired, but the exact wording belongs to the Prophet ﷺ, unlike the Qur'an."}, {"q": "The chain of narrators of a Hadith is called:", "options": ["Sunnah", "Isnad", "Matn", "Rawi"], "answer": 1, "explain": "Isnad refers to the chain linking the narrators back to the Prophet ﷺ."}, {"q": "A Hadith with a weak or broken chain of narration is classified as:", "options": ["Qudsi", "Sahih", "Hasan", "Da'if"], "answer": 3, "explain": "Da'if means 'weak' — such Hadith have a defect in the chain or narrators."}], "theory": [{"q": "Differentiate between Hadith and Sunnah, and explain the criteria used by scholars to classify a Hadith as Sahih, Hasan or Da'if.", "answer": "Cover: definitions of Hadith and Sunnah and how they relate; the three components (Isnad, Matn, Rawi); and the classification criteria — continuity of chain, trustworthiness/precision of narrators, and absence of hidden defects."}]}}, {"num": 4, "title": "Suratul-Fatihah & Ayatul Kursiyy", "category": "Qur'an", "isBreak": false, "breakNote": "", "learn": {"intro": "Two of the most frequently recited passages in the Qur'an, central to Muslim daily worship.", "sections": [{"heading": "Suratul-Fatihah (Q1:1-7)", "points": ["Known as 'the Mother of the Book' (Ummul-Kitab) and 'the Opening', recited in every unit (rak'ah) of the five daily prayers.", "In a Hadith Qudsi (Sahih Muslim), Allah says He has divided the prayer (Fatihah) between Himself and His servant into two halves — praise from the servant, response from Allah.", "It moves through three themes: praise and glorification of Allah, affirmation that worship and help belong to Him alone, and a prayer for guidance to the Straight Path."]}, {"heading": "Ayatul Kursiyy (Q2:255)", "points": ["Called 'the Throne Verse' and widely regarded as the greatest single verse in the Qur'an.", "It describes Allah's eternal life, His sustaining power over all creation, His unmatched knowledge, and His Kursiyy (Throne/dominion) encompassing the heavens and the earth.", "It affirms that nothing can intercede with Allah except by His permission — a powerful statement of Tawhid (Allah's Oneness)."]}, {"heading": "Deeper Insight: Reciting With Understanding", "points": ["The seven verses of Suratul-Fatihah are traditionally counted as: praise (v.1-2), Lordship (v.2-4), worship and dependence (v.5), and guidance (v.6-7) — useful for essay answers asking for a verse-by-verse breakdown.", "Scholars note that Ayatul Kursiyy contains ten distinct statements about Allah, including His eternal life (Al-Hayy), His self-sustenance (Al-Qayyum), and that neither slumber nor sleep overtakes Him.", "The Prophet ﷺ taught that reciting Ayatul Kursiyy after every obligatory prayer, and before sleeping, brings protection — a popular WAEC theory question asks students to state its virtues (fada'il)."]}], "terms": [{"ar": "أم الكتاب", "en": "Ummul-Kitab — 'Mother of the Book', a title for Suratul-Fatihah"}, {"ar": "آية الكرسي", "en": "Ayatul Kursiyy — 'the Throne Verse', Q2:255"}], "refs": [{"label": "Q1:1-7", "url": "https://quran.com/1/1-7", "title": null}, {"label": "Q2:255", "url": "https://quran.com/2/255", "title": null}, {"label": "Sahih Muslim 395", "url": "https://sunnah.com/muslim:395", "title": null}]}, "practice": {"mcq": [{"q": "Suratul-Fatihah is recited:", "options": ["Only at funerals", "Only during Ramadan", "Only once a year", "In every unit (rak'ah) of the five daily prayers"], "answer": 3, "explain": "It is a compulsory part of every rak'ah in the five daily prayers."}, {"q": "In the Hadith Qudsi about Suratul-Fatihah, Allah describes the prayer as divided between:", "options": ["Makkah and Madinah", "The Prophet and the companions", "Himself and Angel Jibril", "Himself and His servant"], "answer": 3, "explain": "Allah says He has divided the prayer (Fatihah) into two halves between Himself and His servant."}, {"q": "Ayatul Kursiyy is found in which chapter of the Qur'an?", "options": ["Suratun-Nas", "Suratul-Ikhlas", "Suratul-Fatihah", "Suratul-Baqarah"], "answer": 3, "explain": "Ayatul Kursiyy is verse 255 of Suratul-Baqarah, Chapter 2."}, {"q": "A major theme of Ayatul Kursiyy is:", "options": ["The history of the Khulafa", "Rules of inheritance", "The rules of fasting", "Allah's power, knowledge and sovereignty over all creation"], "answer": 3, "explain": "The verse emphasises Allah's eternal life, complete knowledge, and dominion over the heavens and earth."}], "theory": [{"q": "Give the English translation's main themes of Suratul-Fatihah and explain two lessons Muslims learn from it.", "answer": "Answer should outline: the three-part structure (praise, Lordship/worship, guidance); and at least two lessons — e.g. that worship and help belong to Allah alone, and the importance of seeking guidance to the Straight Path."}]}}, {"num": 5, "title": "Ibadah: Acts of Worship & Accountability to Allah", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "Understanding why Muslims worship, and how everyday life connects to accountability before Allah.", "sections": [{"heading": "Meaning of 'Ibadah", "points": ["'Ibadah means any act — ritual or ordinary — done sincerely to please Allah, in obedience to His commands.", "Allah states the very purpose of creation in Q51:56: 'I did not create the jinn and mankind except to worship Me.'", "'Ibadah is not limited to Salah or Sawm; honest work, kindness, and good speech done with the right intention are also acts of worship."]}, {"heading": "Intention and Deeds", "points": ["The value of any deed before Allah depends on the sincerity of the intention (niyyah) behind it.", "The Prophet ﷺ said, 'Actions are but by intentions, and every person will have only what they intended' (Nawawi Hadith 1).", "The same outward action can be worship or mere habit, depending on why it is done."]}, {"heading": "Accountability to Allah", "points": ["Every human being will be held accountable before Allah for their beliefs and actions.", "Nothing is hidden from Allah — even the smallest deed is recorded (Q18:49, Q99:7-8).", "Believing in accountability encourages self-discipline, honesty, and good conduct even when no one is watching."]}, {"heading": "Deeper Insight: 'Ibadah in Everyday Life", "points": ["Scholars classify worship into two broad types: Ibadah Mahdah (pure ritual worship like Salah and Sawm, whose form is fixed by revelation) and Ibadah Ghayr Mahdah (general good conduct, whose form is flexible but whose intention must still be sincere).", "A trader who deals honestly, a student who studies diligently, and a parent who cares for their children can all be earning reward — provided the underlying intention is to please Allah, not merely to impress others (a fault called Riya').", "The concept of accountability (Hisab) is closely tied to the Qur'anic image of the 'Illiyyun (record of the righteous) and Sijjin (record of the wicked) — every soul's book of deeds, given in the right hand or the left on Judgement Day."]}], "terms": [{"ar": "عِبَادَة", "en": "'Ibadah — worship / servitude to Allah"}, {"ar": "نِيَّة", "en": "Niyyah — intention"}, {"ar": "حِسَاب", "en": "Hisab — reckoning/accountability"}], "refs": [{"label": "Q51:56", "url": "https://quran.com/51/56", "title": null}, {"label": "Q17:36", "url": "https://quran.com/17/36", "title": null}, {"label": "Q4:58-59", "url": "https://quran.com/4/58-59", "title": null}, {"label": "Q99:7-8", "url": "https://quran.com/99/7-8", "title": null}, {"label": "Q18:49", "url": "https://quran.com/18/49", "title": null}, {"label": "Hadith 18 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:18", "title": null}, {"label": "Hadith 26 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:26", "title": null}]}, "practice": {"mcq": [{"q": "According to Q51:56, the purpose of the creation of jinn and mankind is to:", "options": ["Compete for wealth", "Worship Allah alone", "Build civilizations", "Populate the earth"], "answer": 1, "explain": "Allah states that jinn and mankind were created only to worship Him."}, {"q": "What determines whether an ordinary act (like honest work) counts as 'Ibadah?", "options": ["How long it takes", "Its size or cost", "The sincerity of intention behind it", "Whether it is done in a mosque"], "answer": 2, "explain": "Any act done sincerely to please Allah, in line with His commands, becomes an act of worship."}, {"q": "'Actions are but by intentions...' is from which Hadith of An-Nawawi's collection?", "options": ["Hadith 28", "Hadith 13", "Hadith 5", "Hadith 1"], "answer": 3, "explain": "This is the very first Hadith in Imam an-Nawawi's collection of 40/42 Hadith."}, {"q": "Belief in accountability to Allah encourages Muslims to:", "options": ["Behave well even when unseen by others", "Avoid worship altogether", "Worship only in public", "Focus only on worldly success"], "answer": 0, "explain": "Knowing every deed is recorded encourages sincerity and good conduct at all times."}], "theory": [{"q": "Explain the meaning of 'Ibadah and discuss the relationship between intention and deeds in Islam.", "answer": "A complete answer defines 'Ibadah broadly (not limited to ritual worship), cites Q51:56 on the purpose of creation, and explains the role of niyyah using Hadith 1 of An-Nawawi's collection."}]}}, {"num": 6, "title": "Hadith 1 & 3 of An-Nawawi's Collection", "category": "Hadith", "isBreak": false, "breakNote": "", "learn": {"intro": "Two foundational Hadith every Islamic Studies student should know by heart.", "sections": [{"heading": "Hadith 1 — On Intentions", "points": ["Text (meaning): 'Actions are but by intentions, and every person will have only what they intended...'", "Subject matter: the value of any deed is tied to the sincerity of the intention behind it.", "Lessons: seek sincerity in every act of worship and daily life; the same deed can bring reward or nothing, depending on intention."]}, {"heading": "Hadith 3 — Islam Built on Five Pillars", "points": ["Text (meaning): 'Islam is built upon five [pillars]: testifying that there is no god but Allah and Muhammad is His Messenger; establishing Salah; paying Zakah; Hajj to the House; and fasting Ramadan.'", "Subject matter: the five foundational obligations that structure a Muslim's life.", "Lessons: Islam is a complete, structured way of life; each pillar supports the others like pillars of a building."]}, {"heading": "Deeper Insight: Hadith in Practice", "points": ["Hadith 1 (on intentions) is so foundational that classical scholars, including Imam ash-Shafi'i, said it constitutes roughly one-third of all Islamic knowledge, since almost every act of worship or transaction requires a correct intention.", "Hadith 3 lists the five pillars in a specific order — Shahadah, Salah, Zakah, Sawm, Hajj — though scholars note Sawm and Hajj appear in a different order in some narrations, showing minor textual variation is normal in Hadith transmission.", "WAEC frequently asks students to 'state and explain' the five pillars — always pair each pillar with at least one distinguishing detail (e.g. Zakah's Nisab threshold, Hajj's specific month) for full marks."]}], "terms": [{"ar": "أَرْكَانُ الإِسْلَام", "en": "Arkanul-Islam — the Pillars of Islam"}], "refs": [{"label": "Hadith 1 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:1", "title": null}, {"label": "Hadith 3 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:3", "title": null}]}, "practice": {"mcq": [{"q": "Hadith 1 of An-Nawawi's collection is primarily about:", "options": ["The importance of sincere intention in actions", "The history of the Khulafa", "The five pillars of Islam", "The rules of Zakat"], "answer": 0, "explain": "This famous Hadith teaches that deeds are judged by the intentions behind them."}, {"q": "According to Hadith 3, how many pillars is Islam built upon?", "options": ["Five", "Six", "Three", "Four"], "answer": 0, "explain": "Islam is built on five pillars: Shahadah, Salah, Zakah, Sawm and Hajj."}, {"q": "Which of these is NOT one of the five pillars mentioned in Hadith 3?", "options": ["Shahadah", "Hajj", "Zakah", "Jihad"], "answer": 3, "explain": "Jihad is not one of the five pillars; the five are Shahadah, Salah, Zakah, Sawm and Hajj."}, {"q": "The lesson from Hadith 1 encourages Muslims to:", "options": ["Ensure sincerity of intention in every action", "Do many deeds regardless of intention", "Avoid setting intentions before acts", "Focus only on outward appearance of worship"], "answer": 0, "explain": "The Hadith teaches that sincerity of intention determines the true value of a deed."}], "theory": [{"q": "Recite (in translation) and explain the lessons contained in Hadith 3 of An-Nawawi's Collection on the five pillars of Islam.", "answer": "Answer should state the meaning of the Hadith, list all five pillars correctly, and explain at least two lessons — e.g. that Islam is a structured, complete way of life."}]}}, {"num": 7, "title": "Mid-Term Tests / Open Day", "category": "Break", "isBreak": true, "breakNote": "No new lesson this week — mid-term tests, open day and mid-term holiday. Use this time to revise Weeks 1–6 using the Practice quizzes.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 8, "title": "At-Taharah: Purification", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "Cleanliness is the gateway to worship in Islam — 'Taharah is half of faith' (Nawawi 23).", "sections": [{"heading": "Importance of Taharah", "points": ["Taharah (purification) is a pre-requisite for valid worship — Salah is not accepted without it.", "It reflects Islam's emphasis on both spiritual and physical cleanliness as part of faith."]}, {"heading": "Forms of Taharah", "points": ["Istinja' — cleaning the private parts with water after using the toilet.", "Istijmar — cleaning with clean stones/tissue when water is unavailable.", "Al-Wudu' — ablution before Salah: washing hands, mouth, nose, face, arms, wiping the head, washing the feet, in order.", "At-Tayammum — dry ablution using clean sand/earth when water is unavailable or harmful to use.", "Al-Ghusl — full ritual bath, required after major impurity (e.g. after marital relations, end of menstruation).", "As-Siwak — use of a tooth-stick, recommended especially before Salah, for oral hygiene."]}, {"heading": "Etiquette of Fitrah (Natural Cleanliness)", "points": ["Islam encourages regular trimming of nails, removal of underarm and pubic hair, and general bodily hygiene.", "Proper toilet etiquette is emphasised — using the left hand for cleaning, avoiding facing the Qiblah, and maintaining privacy."]}, {"heading": "Deeper Insight: Beyond the Basic Steps", "points": ["Wudu' consists of both obligatory acts (Fara'id) — washing the face, arms, and feet, and wiping the head — and recommended acts (Sunan) such as rinsing the mouth and nose three times each, which strengthen but do not invalidate the ablution if omitted.", "Tayammum is permitted not only when water is physically absent, but also when using it would cause illness or aggravate an injury — a nuance WAEC theory questions sometimes test.", "Beyond ritual purification, Islam links physical cleanliness to social dignity — clean clothing and a fresh appearance before others, especially before Jumu'ah prayer, are encouraged as part of good Muslim character."]}], "terms": [{"ar": "طَهَارَة", "en": "Taharah — purification"}, {"ar": "وُضُوء", "en": "Wudu' — ablution"}, {"ar": "تَيَمُّم", "en": "Tayammum — dry ablution"}, {"ar": "غُسْل", "en": "Ghusl — full ritual bath"}], "refs": [{"label": "Hadith 23 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:23", "title": null}]}, "practice": {"mcq": [{"q": "What is At-Tayammum?", "options": ["Dry ablution using clean sand/earth", "Full ritual bath", "Trimming of nails", "Washing with water before prayer"], "answer": 0, "explain": "Tayammum is performed with clean sand or earth when water is unavailable or would cause harm."}, {"q": "Al-Ghusl is required after:", "options": ["Reciting the Qur'an", "Every Salah", "Major ritual impurity, e.g. after marital relations", "Eating a meal"], "answer": 2, "explain": "Ghusl (full bath) is required after major impurity such as after marital relations or the end of menstruation."}, {"q": "As-Siwak refers to:", "options": ["Use of a tooth-stick for oral hygiene", "A kind of Zakat", "A type of Salah", "A form of fasting"], "answer": 0, "explain": "Siwak is a natural tooth-stick used for cleaning the teeth, especially recommended before Salah."}, {"q": "Taharah is important in Islam mainly because:", "options": ["It is only a cultural custom", "It is a pre-requisite for valid worship such as Salah", "It is optional for adults", "It has no connection to worship"], "answer": 1, "explain": "Without Taharah, acts of worship like Salah are not valid."}], "theory": [{"q": "Discuss the various forms of Taharah and explain their importance to a Muslim's worship.", "answer": "Should mention Istinja'/Istijmar, Wudu', Tayammum, Ghusl and Siwak, with a brief description of each, and explain why purification is essential before Salah."}]}}, {"num": 9, "title": "The Jahiliyyah Period: Arabia Before Islam", "category": "Tarikh", "isBreak": false, "breakNote": "", "learn": {"intro": "Understanding the society into which Islam was revealed helps explain the reforms Islam brought.", "sections": [{"heading": "Meaning and Location", "points": ["'Jahiliyyah' means 'the age of ignorance' — the period in Arabia before the advent of Islam.", "Arabia is a peninsula bordered by the Red Sea, the Arabian Gulf and the Indian Ocean, mostly desert with a few fertile areas like Makkah, Madinah (Yathrib) and Ta'if."]}, {"heading": "Social Life", "points": ["Society was organised around tribes, with strong loyalty to one's clan often overriding justice.", "Marriage practices varied widely, some exploitative to women; divorce could be pronounced without limit or fairness.", "Inheritance customs excluded women and children in many tribes.", "Female infanticide (burying baby girls alive) was practised by some tribes out of shame or poverty — later strongly condemned by Islam (Q81:8-9)."]}, {"heading": "Religious, Political and Economic Life", "points": ["Most Arabs practised idol worship; the Ka'bah housed around 360 idols, including Al-Lat, Al-'Uzza, Manat and Hubal.", "There was no central government — Arabia was ruled by tribal chiefs, and conflicts were often settled by tribal custom or warfare.", "The economy relied on trade caravans (notably Makkah's summer and winter caravans, Q106), pastoralism (herding), and some agriculture in fertile areas."]}, {"heading": "Reforms Introduced by Islam", "points": ["Islam abolished idol worship and established Tawhid (belief in One God).", "It banned female infanticide and gave women rights to inheritance, marriage consent, and property.", "It replaced blind tribalism with a united Ummah based on faith, and established justice as a right for all, not only the powerful."]}, {"heading": "Deeper Insight: Balancing the Picture", "points": ["Not everything in Jahiliyyah Arabia was negative — Arabs of that era were famed for hospitality to strangers, eloquent poetry (showcased at markets like 'Ukaz), and courage in defending their tribe — qualities Islam preserved and refined rather than abolished outright.", "The Hilful-Fudul (Pact of the Virtuous), which the young Muhammad ﷺ took part in before Prophethood, was a pre-Islamic alliance to protect the wronged and needy in Makkah — the Prophet ﷺ later said he would still honour such a pact even after Islam.", "WAEC essay questions often ask for a comparison of Jahiliyyah practices with Islamic reforms — structure your answer as a table in your head: practice before Islam, then the specific Qur'anic correction, for each point you raise."]}], "terms": [{"ar": "جَاهِلِيَّة", "en": "Jahiliyyah — the age of ignorance before Islam"}, {"ar": "كَعْبَة", "en": "Ka'bah — the sacred House in Makkah"}], "refs": [{"label": "Q81:8-9", "url": "https://quran.com/81/8-9", "title": null}, {"label": "Q106", "url": "https://quran.com/106", "title": "Q106 (Suratu Quraysh)"}]}, "practice": {"mcq": [{"q": "The word 'Jahiliyyah' refers to:", "options": ["The age of the Prophets", "The golden age of Islam", "The period of ignorance in Arabia before Islam", "The reign of the Khulafa"], "answer": 2, "explain": "Jahiliyyah describes the pre-Islamic period characterised by ignorance of true monotheism and various social ills."}, {"q": "The Ka'bah before Islam housed approximately how many idols?", "options": ["60", "10", "360", "1000"], "answer": 2, "explain": "Tradition holds the Ka'bah contained around 360 idols before it was cleansed by the Prophet ﷺ at the Conquest of Makkah."}, {"q": "A harmful social practice of the Jahiliyyah period that Islam abolished was:", "options": ["Female infanticide", "Poetry recitation", "Hospitality to guests", "Trading in caravans"], "answer": 0, "explain": "Islam strongly condemned and abolished the burial of infant girls alive (Q81:8-9)."}, {"q": "Arabia's economy before Islam relied heavily on:", "options": ["Fishing alone", "Banking systems", "Trade caravans and pastoralism", "Industrial manufacturing"], "answer": 2, "explain": "Trade caravans (e.g. Quraysh's) and herding/pastoralism were central to the pre-Islamic Arabian economy."}], "theory": [{"q": "Describe the religious and social life of Arabia during the Jahiliyyah period, and discuss two reforms introduced by Islam.", "answer": "Should describe idol worship at the Ka'bah and social ills (e.g. unfair inheritance, female infanticide), then explain at least two Islamic reforms such as establishing Tawhid and granting women rights."}]}}, {"num": 10, "title": "Iman: Faith, Articles of Faith & Kalimatush-Shahadah", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "Iman is the foundation upon which every other pillar of Islam is built.", "sections": [{"heading": "Meaning and Significance of Iman", "points": ["Iman means firm belief, trust and conviction — specifically, belief in Allah and all He has revealed.", "It is the foundation of all worship; without Iman, outward acts hold no true spiritual value before Allah.", "Nawawi Hadith 2 (the famous Hadith of Jibril) sets out the pillars of Iman clearly, alongside Islam and Ihsan."]}, {"heading": "The Six Articles of Faith", "points": ["Belief in Allah — His Oneness (Tawhid), with no partner or equal (Q112, Q2:255).", "Belief in His Angels — unseen beings created from light who carry out Allah's commands (Q2:285).", "Belief in His Books — divine scriptures including the Qur'an, Tawrah, Injil and Zabur (Q2:285).", "Belief in His Messengers — including the Ulul-'Azm (Messengers of firm resolve): Ibrahim, Nuh, Musa, 'Isa and Muhammad ﷺ (Q46:35).", "Belief in the Day of Resurrection — that all will be raised and judged for eternal reward or punishment.", "Belief in Qadar (Divine Decree) — that all things occur by Allah's knowledge and will."]}, {"heading": "Kalimatush-Shahadah", "points": ["The testimony: 'La ilaha illallah, Muhammadur Rasulullah' — 'There is no god but Allah, Muhammad is the Messenger of Allah.'", "Conditions for a valid Shahadah include knowledge of its meaning, certainty, sincerity, and acceptance without rejection of any part.", "It is the entry point into Islam and the first pillar."]}, {"heading": "Islam and the Concept of Trinity", "points": ["Islam firmly rejects the concept of Trinity — Allah is absolutely One, with no partner, son, or equal (Q4:171, Q5:75-76, Q112).", "Suratul-Ikhlas (Q112) is considered a concise summary of Tawhid: 'Say: He is Allah, the One... He begets not, nor is He begotten.'"]}, {"heading": "Deeper Insight: Qadar and Human Responsibility", "points": ["Belief in Qadar does not cancel human free will and responsibility — mainstream Sunni theology holds that Allah's foreknowledge of events does not force human beings to act; people still choose and are answerable for their choices.", "The Qur'an distinguishes Qada' (Allah's eternal decree/decision) from Qadar (the measured unfolding of that decree in time) — a subtle distinction sometimes tested in SS1-SS3 theory questions.", "Suratul-Ikhlas (Q112) is regarded by many scholars as equal in reward to reciting one-third of the Qur'an, according to an authentic Hadith — a fact worth remembering when discussing the importance of Tawhid."]}], "terms": [{"ar": "إيمان", "en": "Iman — faith/belief"}, {"ar": "شَهَادَة", "en": "Shahadah — the testimony of faith"}, {"ar": "أُولُو العَزْم", "en": "Ulul-'Azm — Messengers of firm resolve"}], "refs": [{"label": "Q2:163", "url": "https://quran.com/2/163", "title": null}, {"label": "Q2:255", "url": "https://quran.com/2/255", "title": null}, {"label": "Q112", "url": "https://quran.com/112", "title": null}, {"label": "Q4:171", "url": "https://quran.com/4/171", "title": null}, {"label": "Q5:75-76", "url": "https://quran.com/5/75-76", "title": null}, {"label": "Hadith 2 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:2", "title": null}]}, "practice": {"mcq": [{"q": "How many Articles of Faith (Iman) are there in Islam?", "options": ["Five", "Six", "Four", "Seven"], "answer": 1, "explain": "The six articles are: Allah, His Angels, His Books, His Messengers, the Last Day, and Qadar (Destiny)."}, {"q": "Which group of Prophets is referred to as 'Ulul-'Azm' (of firm resolve)?", "options": ["Only the Prophets sent to Makkah", "Only Adam and Nuh", "Ibrahim, Nuh, Musa, 'Isa and Muhammad ﷺ", "All 25 named Prophets equally"], "answer": 2, "explain": "The Ulul-'Azm are the five Messengers noted for exceptional patience and resolve: Ibrahim, Nuh, Musa, 'Isa and Muhammad ﷺ."}, {"q": "The Kalimatush-Shahadah is:", "options": ["The testimony of faith that opens the door to Islam", "A type of Hajj ritual", "A form of Zakat", "A Hadith about fasting"], "answer": 0, "explain": "The Shahadah — testifying to Allah's Oneness and Muhammad's ﷺ Prophethood — is the first pillar of Islam."}, {"q": "Islam's position on the concept of Trinity is that:", "options": ["It has no position on it", "It supports the concept fully", "It firmly rejects it, affirming Allah's absolute Oneness", "It accepts it partially"], "answer": 2, "explain": "The Qur'an (e.g. Q112, Q4:171, Q5:75-76) firmly rejects Trinity, affirming Tawhid."}], "theory": [{"q": "Enumerate the six Articles of Faith in Islam and explain the Islamic position on the concept of Trinity.", "answer": "Should list all six articles accurately, then explain Islam's rejection of Trinity with reference to at least one Qur'anic verse (e.g. Q112 or Q4:171)."}]}}, {"num": 11, "title": "The Life and Mission of Prophet Muhammad ﷺ (Birth to Hijrah)", "category": "Tarikh", "isBreak": false, "breakNote": "", "learn": {"intro": "From an orphan in Makkah to the Messenger who reshaped Arabia and the world.", "sections": [{"heading": "Birth and Childhood", "points": ["Muhammad ﷺ was born in Makkah in the 'Year of the Elephant' (c. 570 CE), named after Abrahah's failed attack on the Ka'bah.", "His father, 'Abdullah, died before his birth; his mother, Aminah, died when he was six.", "He was nursed in infancy by Halimah as-Sa'diyyah among the Bani Sa'd, then raised by his grandfather 'Abdul-Muttalib, and after his death, by his uncle Abu Talib."]}, {"heading": "Adulthood, Occupation and Marriage", "points": ["As a young man he worked as a shepherd and later a trader, travelling with caravans including to Syria.", "He earned the title Al-Amin ('the Trustworthy') for his honesty and reliability, long before Prophethood.", "At 25, he married Khadijah bint Khuwaylid, a respected and wealthy businesswoman 15 years his senior, who employed him to trade on her behalf."]}, {"heading": "Call to Prophethood and Persecution", "points": ["At age 40, he received the first revelation in Cave Hira and began his mission, first calling people privately, then publicly.", "The Quraysh leaders opposed him fiercely — early Muslims, especially the poor and enslaved (like Bilal), faced torture and boycott.", "Despite persecution, the Prophet ﷺ remained patient and continued inviting people to Islam."]}, {"heading": "Hijrah: Causes, Course and Significance", "points": ["Causes: intensifying persecution in Makkah, and an invitation from the people of Yathrib (Madinah) after the pledges of 'Aqabah.", "Course: the Prophet ﷺ and Abu Bakr hid in Cave Thawr to evade pursuers, then journeyed to Madinah, arriving safely after a dangerous trip.", "Significance: it marked the start of the Islamic (Hijri) calendar, the founding of the first organised Muslim community (Ummah), and a turning point from persecution to establishment."]}, {"heading": "Deeper Insight: Lessons From His Early Life", "points": ["The Prophet's ﷺ early experience as an orphan shaped the Qur'an's repeated emphasis on kindness to orphans (e.g. Q93:6-9, Q2:220) — a link worth drawing when answering questions on his character.", "His reputation as Al-Amin was so strong that even his fiercest opponents, like Abu Jahl, privately acknowledged his honesty even while publicly rejecting his message — illustrating that his call to Prophethood was not doubted on the grounds of his character.", "The first believers form a well-known list worth memorising: Khadijah (first woman), Abu Bakr (first free adult man), 'Ali (first among children/youth), and Zayd ibn Harithah (first among freed slaves)."]}], "terms": [{"ar": "الأمين", "en": "Al-Amin — 'the Trustworthy', title given to the Prophet ﷺ before Prophethood"}, {"ar": "هِجْرَة", "en": "Hijrah — migration, specifically from Makkah to Madinah"}], "refs": []}, "practice": {"mcq": [{"q": "Prophet Muhammad ﷺ was given the title 'Al-Amin' because of his:", "options": ["Wealth", "Trustworthiness and honesty", "Poetry skills", "Military leadership"], "answer": 1, "explain": "He earned this title, meaning 'the Trustworthy', for his honesty long before Prophethood."}, {"q": "At what age did Prophet Muhammad ﷺ marry Khadijah?", "options": ["18", "25", "40", "50"], "answer": 1, "explain": "He married Khadijah at the age of 25."}, {"q": "The Hijrah refers to the migration of the Prophet ﷺ from:", "options": ["Makkah to Ta'if", "Makkah to Madinah", "Madinah to Makkah", "Madinah to Ta'if"], "answer": 1, "explain": "Hijrah is the migration from Makkah to Madinah (Yathrib) due to persecution."}, {"q": "The Hijrah is significant mainly because it:", "options": ["Happened after the Prophet's death", "Ended the Prophet's mission", "Marked the start of the Islamic calendar and the founding of the Ummah", "Was a purely trade journey"], "answer": 2, "explain": "The Hijrah marks the beginning of the Hijri calendar and the establishment of an organised Muslim community in Madinah."}], "theory": [{"q": "Discuss the causes, course and significance of the Hijrah of Prophet Muhammad ﷺ.", "answer": "Should cover: causes (persecution, invitation of Yathrib/pledges of 'Aqabah); course (Cave Thawr, the journey); significance (start of Hijri calendar, founding of the Ummah)."}]}}, {"num": 12, "title": "General Revision", "category": "Break", "isBreak": true, "breakNote": "Use this week to revisit every topic and re-take the Practice quizzes across all weeks of SS1 First Term.", "learn": {}, "practice": {"mcq": [], "theory": []}}, {"num": 13, "title": "Examination", "category": "Break", "isBreak": true, "breakNote": "End-of-term examination week. No new lesson content.", "learn": {}, "practice": {"mcq": [], "theory": []}}]}, "ss2": {"label": "SS2", "full": "Senior Secondary School 2", "weeks": [{"num": 1, "title": "Suratul-Qari'ah & Suratut-Takathur", "category": "Qur'an", "isBreak": false, "breakNote": "", "learn": {"intro": "Two short, powerful Makkan chapters warning about the Day of Judgement and worldly distraction.", "sections": [{"heading": "Suratul-Qari'ah (Q101) — 'The Striking Calamity'", "points": ["Describes the Day of Judgement as 'Al-Qari'ah' — the event that strikes hearts with terror.", "Depicts people scattered like moths, mountains like carded wool — vivid imagery of a shattered universe.", "Introduces the weighing of deeds: those whose good deeds are heavy will have a pleasant life; those whose deeds are light face a blazing Fire."]}, {"heading": "Suratut-Takathur (Q102) — 'Rivalry in Worldly Increase'", "points": ["Condemns the human obsession with accumulating wealth, status and numbers, to the point of distraction from Allah.", "Warns that this rivalry continues 'until you visit the graves' — i.e., until death itself.", "States that every person will be questioned about the worldly pleasures (blessings) they enjoyed."]}, {"heading": "Deeper Insight: Reading These Chapters Together", "points": ["Both Suras belong to the last portion of the Qur'an (Juz' 'Amma), commonly the first Suwar memorised by young students because of their brevity and powerful imagery.", "Al-Qari'ah's imagery of scattered moths and carded wool would have been vividly familiar to its first audience in Arabia, using everyday sights to describe cosmic upheaval.", "Takathur's warning applies broadly — not only to wealth, but to competing over followers, children, technology, or status; commentators note the verse's relevance has only grown in a modern consumer society."]}], "terms": [{"ar": "القارعة", "en": "Al-Qari'ah — the Striking Calamity, a name for the Day of Judgement"}, {"ar": "تَكَاثُر", "en": "Takathur — rivalry in seeking increase (wealth, numbers)"}], "refs": [{"label": "Q101", "url": "https://quran.com/101", "title": null}, {"label": "Q102", "url": "https://quran.com/102", "title": null}]}, "practice": {"mcq": [{"q": "Suratul-Qari'ah primarily describes:", "options": ["The life of the Prophet", "Rules of marriage", "The terrifying events of the Day of Judgement", "Zakat calculation"], "answer": 2, "explain": "Al-Qari'ah is one of the Qur'an's vivid descriptions of the Day of Judgement."}, {"q": "According to Suratul-Qari'ah, a person whose good deeds are heavy on the scale will have:", "options": ["A pleasant/satisfying life", "No judgement at all", "To repeat life on earth", "A painful life"], "answer": 0, "explain": "The Surah promises a pleasant life for those whose good deeds outweigh on the scale."}, {"q": "Suratut-Takathur warns against:", "options": ["Praying too often", "Helping the poor", "Excessive rivalry in accumulating wealth and status", "Reciting the Qur'an too much"], "answer": 2, "explain": "The Surah condemns the human tendency to compete endlessly for worldly increase."}, {"q": "According to Suratut-Takathur, humans will be questioned about:", "options": ["Their physical height", "Their tribal ancestry", "Their place of birth", "The worldly pleasures/blessings they enjoyed"], "answer": 3, "explain": "The Surah states everyone will be asked about the delights (blessings) they enjoyed in life."}], "theory": [{"q": "State the central themes of Suratul-Qari'ah and Suratut-Takathur and explain one lesson from each.", "answer": "Should identify the Day of Judgement theme in Al-Qari'ah (with a lesson on preparing good deeds) and the warning against worldly rivalry in Takathur (with a lesson on moderation/accountability)."}]}}, {"num": 2, "title": "Sawm (Fasting)", "category": "Tawhid & Fiqh", "isBreak": false, "breakNote": "", "learn": {"intro": "The fourth pillar of Islam — fasting as a spiritual, social and moral discipline.", "sections": [{"heading": "Meaning and Types", "points": ["Sawm means abstaining from food, drink and marital relations from dawn (Fajr) to sunset (Maghrib), with the sincere intention to worship Allah (Q2:183).", "Compulsory fasts: the month of Ramadan, Kaffarah (expiation fasts for certain sins/violations), and Nadr (a vow to fast).", "Voluntary fasts: six days of Shawwal, the Day of 'Ashura' and Tasu'a, Mondays and Thursdays, among others."]}, {"heading": "Those Exempted from Fasting", "points": ["The sick, travellers, the elderly and infirm, and pregnant or nursing mothers may be exempted, often with an obligation to make up missed days or pay Fidyah (compensation).", "Menstruating women do not fast during their cycle and must make up the missed days afterward."]}, {"heading": "Things That Vitiate the Fast", "points": ["Deliberately eating or drinking, marital relations during fasting hours, and intentionally inducing vomiting invalidate the fast.", "Forgetfully eating or drinking does not break the fast, as it is unintentional."]}, {"heading": "Benefits of Sawm", "points": ["Spiritual: builds Taqwa (God-consciousness) and self-discipline (Q2:183).", "Social: fosters empathy for the poor and hungry, and strengthens community bonds during Ramadan.", "Moral: trains patience, self-control, and restraint from bad habits and language."]}, {"heading": "Deeper Insight: The Wisdom Behind the Rules", "points": ["Kaffarah (expiation) fasting is required in specific situations, such as deliberately breaking a Ramadan fast without valid excuse, and typically involves fasting 60 consecutive days or feeding 60 poor persons.", "The pre-dawn meal (Suhur) and the meal to break the fast (Iftar) both carry recommended etiquette — eating Suhur late (close to Fajr) and hastening to break the fast at sunset are both Prophetic Sunnahs.", "Modern medical research has highlighted physical benefits of temporary fasting (e.g. on metabolism), which some contemporary Islamic Studies teachers use to illustrate that Islamic worship often carries wisdom beyond the purely spiritual."]}], "terms": [{"ar": "صَوْم", "en": "Sawm — fasting"}, {"ar": "فِدْيَة", "en": "Fidyah — compensation for missed fasts"}, {"ar": "تَقْوَى", "en": "Taqwa — God-consciousness"}], "refs": [{"label": "Q2:183", "url": "https://quran.com/2/183", "title": null}, {"label": "Hadith 3 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:3", "title": null}]}, "practice": {"mcq": [{"q": "Sawm involves abstaining from food, drink and marital relations from:", "options": ["Noon to midnight", "Midnight to noon", "Dawn (Fajr) to sunset (Maghrib)", "Sunset to dawn"], "answer": 2, "explain": "The fast runs from dawn (Fajr) to sunset (Maghrib)."}, {"q": "Which of these is an example of a compulsory fast?", "options": ["Fasting six days of Shawwal", "Fasting on Mondays", "The Day of 'Ashura'", "The month of Ramadan"], "answer": 3, "explain": "Ramadan is a compulsory fast, unlike Mondays/Thursdays, Shawwal or 'Ashura' which are voluntary."}, {"q": "A traveller who is unable to fast in Ramadan is generally required to:", "options": ["Never fast again", "Make up the missed days later", "Pay a fine to the mosque", "Fast double the following year"], "answer": 1, "explain": "Travellers (and similarly the sick) may break the fast but should make up the missed days afterward."}, {"q": "One spiritual benefit of Sawm is that it builds:", "options": ["Taqwa (God-consciousness)", "Wealth", "Physical strength only", "Political power"], "answer": 0, "explain": "Q2:183 states fasting is prescribed 'that you may attain Taqwa'."}], "theory": [{"q": "Discuss the spiritual, social and moral significance of Sawm (fasting) in Islam.", "answer": "Should explain at least one benefit in each category: spiritual (Taqwa), social (empathy with the poor, community bonding), and moral (self-discipline, patience)."}]}}, {"num": 3, "title": "Political Administration of the Prophet ﷺ & the Four Khulafa", "category": "Tarikh", "isBreak": false, "breakNote": "", "learn": {"intro": "How the Prophet ﷺ governed Madinah, and how leadership continued after his death.", "sections": [{"heading": "The Prophet's Administration in Madinah", "points": ["Upon arrival in Madinah, the Prophet ﷺ built the first mosque as a centre for worship, learning and governance.", "He drafted the Constitution of Madinah, uniting Muslims, Jews and other groups under agreed terms of mutual protection and cooperation.", "He practised Shura (consultation) with companions on communal matters, alongside firm justice and fairness for all, regardless of status."]}, {"heading": "Leadership Qualities of the Prophet ﷺ", "points": ["Equity and justice: he ruled that even his own family would not be spared if they broke the law.", "Fair play and mercy: he forgave former enemies (e.g. at the Conquest of Makkah) and treated allies and opponents with dignity."]}, {"heading": "The Four Rightly-Guided Caliphs (Khulafa'ur-Rashidun)", "points": ["Abu Bakr as-Siddiq (r. 632-634 CE): fought the Riddah Wars to keep the Ummah united after apostasy revolts; initiated the compilation of the Qur'an.", "'Umar ibn al-Khattab (r. 634-644 CE): rapid, well-organised territorial expansion; introduced the Hijri calendar and formal administrative institutions (e.g. Bayt al-Mal, provincial governance).", "'Uthman ibn 'Affan (r. 644-656 CE): standardised the Qur'anic text; expanded the Muslim navy; faced growing internal unrest in his later years.", "'Ali ibn Abi Talib (r. 656-661 CE): known for wisdom and justice; his caliphate faced civil strife (Fitnah) including the Battles of the Camel and Siffin."]}, {"heading": "Deeper Insight: Comparing the Four Caliphs", "points": ["A helpful way to remember the Khulafa is by their signature achievement: Abu Bakr = preservation (of the Ummah and the Qur'an), 'Umar = expansion and administration, 'Uthman = standardisation, 'Ali = steadfastness amid trial.", "'Umar's introduction of the Diwan (register for state stipends) and provincial governors marked one of the earliest organised civil administrations in history, predating many later government systems.", "The period of the four Khulafa is often called 'the Golden Age of the Caliphate' precisely because leadership was chosen by consultation (Shura) and merit, not inherited by bloodline — a model WAEC essay questions often ask students to evaluate."]}], "terms": [{"ar": "شُورَى", "en": "Shura — mutual consultation"}, {"ar": "خُلَفَاءُ الرَّاشِدِين", "en": "Khulafa'ur-Rashidun — the Rightly-Guided Caliphs"}], "refs": []}, "practice": {"mcq": [{"q": "The document the Prophet ﷺ drafted to unite the different groups in Madinah is called:", "options": ["The Treaty of Hudaybiyyah", "The Farewell Sermon", "The Constitution of Madinah", "The Pledge of 'Aqabah"], "answer": 2, "explain": "The Constitution of Madinah organised relations between Muslims, Jews and other residents of the city."}, {"q": "Which Caliph fought the Riddah Wars to keep the Ummah united?", "options": ["Abu Bakr", "'Umar", "'Uthman", "'Ali"], "answer": 0, "explain": "Abu Bakr as-Siddiq led the fight against apostasy and rebellion after the Prophet's death."}, {"q": "Which Caliph introduced the Hijri calendar?", "options": ["'Uthman ibn 'Affan", "Abu Bakr", "'Umar ibn al-Khattab", "'Ali ibn Abi Talib"], "answer": 2, "explain": "'Umar ibn al-Khattab formally introduced the Islamic (Hijri) calendar."}, {"q": "Which Caliph is credited with standardising the Qur'anic text into one dialect?", "options": ["'Umar", "Abu Bakr", "'Uthman", "'Ali"], "answer": 2, "explain": "'Uthman ibn 'Affan ordered the standardisation of the Qur'an into the Quraysh dialect."}], "theory": [{"q": "Discuss the leadership qualities of Prophet Muhammad ﷺ and highlight one major achievement of each of the four Rightly-Guided Caliphs.", "answer": "Should mention at least two leadership qualities (e.g. justice, consultation) and one clear achievement per Caliph: Abu Bakr (Riddah wars/Qur'an compilation), 'Umar (expansion/calendar), 'Uthman (Qur'an standardisation), 'Ali (justice amid civil strife)."}]}}, {"num": 4, "title": "Hadith 10th, 11th & 12th of An-Nawawi's Collection", "category": "Hadith", "isBreak": false, "breakNote": "", "learn": {"intro": "Three Hadith guiding Muslims on lawful earning, avoiding doubt, and minding one's own business.", "sections": [{"heading": "Hadith 10 — Allah is Good, Accepts Only Good", "points": ["The Prophet ﷺ taught that Allah is pure and accepts only what is pure, and commanded believers to eat only from what is lawful (halal).", "Lesson: lawful earning and consumption directly affect the acceptance of worship and supplication."]}, {"heading": "Hadith 11 — Leave Doubt for Certainty", "points": ["'Leave that which makes you doubt for that which does not make you doubt.'", "Lesson: when unsure whether something is permissible, caution and avoiding it is the safer, wiser path."]}, {"heading": "Hadith 12 — Minding One's Own Business", "points": ["'Part of the perfection of one's Islam is his leaving that which does not concern him.'", "Lesson: avoiding unnecessary interference in others' affairs and idle talk reflects mature, sincere faith."]}, {"heading": "Deeper Insight: Living These Hadith Daily", "points": ["Hadith 10's teaching that 'Allah accepts only good' is often linked by scholars to Q23:51, where Prophets themselves are commanded to eat only of the good/lawful things.", "Hadith 11's guidance on doubtful matters gave rise to the broader Islamic legal principle: 'certainty is not overruled by doubt' (al-yaqinu la yazulu bish-shakk), a foundational rule in Islamic jurisprudence (Fiqh).", "Hadith 12 is sometimes summarised by scholars as 'the Hadith of good manners', since avoiding gossip and unnecessary interference is considered a mark of refined character (Husnul-Khuluq)."]}], "terms": [{"ar": "حَلَال", "en": "Halal — lawful"}, {"ar": "شَكّ", "en": "Shakk — doubt"}], "refs": [{"label": "Hadith 10 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:10", "title": null}, {"label": "Hadith 11 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:11", "title": null}, {"label": "Hadith 12 (An-Nawawi)", "url": "https://sunnah.com/nawawi40:12", "title": null}]}, "practice": {"mcq": [{"q": "Hadith 10 emphasises that Allah accepts only:", "options": ["Large amounts of charity", "What is pure and lawful (halal)", "Loud worship", "Long prayers"], "answer": 1, "explain": "The Hadith teaches that Allah is pure and accepts only pure/lawful deeds and earnings."}, {"q": "Hadith 11 advises Muslims to:", "options": ["Always choose the doubtful option", "Leave what causes doubt for what is certain", "Ask others to decide for them always", "Ignore all doubts"], "answer": 1, "explain": "The Hadith counsels leaving doubtful matters in favour of what is certainly permissible."}, {"q": "According to Hadith 12, part of the perfection of a person's Islam is:", "options": ["Avoiding all social interaction",
